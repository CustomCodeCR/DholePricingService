name: Apply CRC Service Currency Rules Pricing 20260828

on:
  push:
    branches: [fix/crc-service-currency-rules-20260828]
    paths:
      - '.github/scripts/apply-crc-service-currency-rules-20260828.py'
      - '.github/workflows/apply-crc-service-currency-rules-20260828.yml'
      - 'src/Dhole.Pricing.Application/Services/CostaRicaServiceCurrencyRules.cs'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/crc-service-currency-rules-20260828
          fetch-depth: 0

      - name: Apply implementation
        run: python3 .github/scripts/apply-crc-service-currency-rules-20260828.py

      - name: Build Pricing API and Worker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e GITHUB_ACTOR="$GITHUB_ACTOR" \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -v "$PWD:/src" -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0 bash -lc '
              set -euo pipefail
              export NuGetPackageSourceCredentials_github="Username=${GITHUB_ACTOR};Password=${GITHUB_TOKEN};ValidAuthenticationTypes=Basic"
              dotnet restore src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj --configfile NuGet.Config
              dotnet build src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj --no-restore --configuration Release
              dotnet restore src/Dhole.Pricing.Workers/Dhole.Pricing.Workers.csproj --configfile NuGet.Config
              dotnet build src/Dhole.Pricing.Workers/Dhole.Pricing.Workers.csproj --no-restore --configuration Release
            '

      - name: Build production images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Api/Dockerfile -t dhole/pricing-crc-rules-api-validation .
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Workers/Dockerfile -t dhole/pricing-crc-rules-worker-validation .

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Maurice Lang'
          git config user.email '106346768+MauLang18@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'fix(pricing): persist and enforce CRC service currencies'
          git push origin HEAD:fix/crc-service-currency-rules-20260828
