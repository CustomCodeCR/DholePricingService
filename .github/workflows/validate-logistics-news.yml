name: Validate Pricing Logistics News

on:
  push:
    branches: [feature/logistics-news-20260828]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and generate EF migration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e GITHUB_ACTOR="$GITHUB_ACTOR" \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -v "$PWD:/src" \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            bash -lc '
              set -euo pipefail
              export NuGetPackageSourceCredentials_github="Username=${GITHUB_ACTOR};Password=${GITHUB_TOKEN};ValidAuthenticationTypes=Basic"
              dotnet restore src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj --configfile NuGet.Config
              dotnet build src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj --no-restore
              if ! ls src/Dhole.Pricing.Persistence/Migrations/*AddLogisticsNewsAndSyncModel20260828.cs >/dev/null 2>&1; then
                dotnet tool install --tool-path /tmp/dotnet-tools dotnet-ef --version 10.0.9
                /tmp/dotnet-tools/dotnet-ef migrations add AddLogisticsNewsAndSyncModel20260828 \
                  --project src/Dhole.Pricing.Persistence/Dhole.Pricing.Persistence.csproj \
                  --startup-project src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj \
                  --context ServiceDbContext \
                  --no-build
              fi
            '

      - name: Validate Pricing API and Worker builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker build --pull \
            --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" \
            --secret id=github_token,env=GITHUB_TOKEN \
            -f src/Dhole.Pricing.Api/Dockerfile \
            -t dhole/pricing-logistics-news-api-validation .
          docker build --pull \
            --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" \
            --secret id=github_token,env=GITHUB_TOKEN \
            -f src/Dhole.Pricing.Workers/Dockerfile \
            -t dhole/pricing-logistics-news-worker-validation .

      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Dhole.Pricing.Persistence/Migrations
          if git diff --cached --quiet; then
            echo "No generated migration changes to commit."
            exit 0
          fi
          git commit -m 'feat(pricing): migrate logistics news and sync model'
          git push origin HEAD:feature/logistics-news-20260828
