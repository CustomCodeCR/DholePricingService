name: Regenerate rate comparison EF migration

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/fix-rate-comparison-ef.yml'

permissions:
  contents: write
  packages: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build Pricing without manual comparison migration
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
        run: |
          rm -f src/Dhole.Pricing.Persistence/Migrations/20260904023000_AddRateComparisons.cs
          dotnet restore src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj --configfile NuGet.Config
          dotnet build src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj -c Release --no-restore

      - name: Generate EF migration and snapshot
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.9
          dotnet ef migrations add AddRateComparisons \
            --project src/Dhole.Pricing.Persistence/Dhole.Pricing.Persistence.csproj \
            --startup-project src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj \
            --context ServiceDbContext \
            --output-dir Migrations \
            --configuration Release \
            --no-build

      - name: Commit generated EF files and remove temporary workflow
        run: |
          git rm .github/workflows/fix-rate-comparison-ef.yml
          git add src/Dhole.Pricing.Persistence/Migrations
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pricing): sync rate comparison EF migration'
          git push origin develop
