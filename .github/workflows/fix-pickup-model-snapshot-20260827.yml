name: Fix pickup model snapshot

on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/fix-pickup-model-snapshot-20260827.py'
      - '.github/workflows/fix-pickup-model-snapshot-20260827.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/fix-pickup-model-snapshot-20260827.py
      - shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/fix-pickup-model-snapshot-20260827.py
          rm -f .github/workflows/fix-pickup-model-snapshot-20260827.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(pricing): align pickup model snapshot'
          git push origin HEAD:master
