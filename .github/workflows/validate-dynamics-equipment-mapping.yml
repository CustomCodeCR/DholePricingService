name: Validate Dynamics equipment mapping

on:
  pull_request:
    branches: [develop, master]
    paths:
      - 'src/Dhole.Pricing.Api/Services/DynamicsQuotePayloadBuilder.cs'
      - 'tests/Dhole.Pricing.IntegrationTests/DynamicsQuotePayloadBuilderTests.cs'
      - '.github/workflows/validate-dynamics-equipment-mapping.yml'

permissions:
  contents: read
  packages: read

jobs:
  validate-equipment-mapping:
    name: Build and test Dynamics equipment choices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username github-actions --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile NuGet.Config
      - name: Restore integration tests
        run: dotnet restore tests/Dhole.Pricing.IntegrationTests/Dhole.Pricing.IntegrationTests.csproj --configfile NuGet.Config
      - name: Compile Pricing integration tests
        run: dotnet build tests/Dhole.Pricing.IntegrationTests/Dhole.Pricing.IntegrationTests.csproj --configuration Release --no-restore
      - name: Validate all Dynamics equipment and existing quote mappings
        run: dotnet test tests/Dhole.Pricing.IntegrationTests/Dhole.Pricing.IntegrationTests.csproj --configuration Release --no-build --filter FullyQualifiedName~DynamicsQuotePayloadBuilderTests --logger "console;verbosity=normal"
