name: Apply editable client executive persistence
# Validate API + worker RateDto projections — 2026-08-28

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-editable-client-executive-20260828.yml'

permissions:
  contents: write
  packages: read

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout pricing
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply commercial snapshot patch
        run: |
          python3 .github/scripts/apply_editable_client_executive_20260828.py
          python3 .github/scripts/fix_editable_client_executive_projection_20260828.py

      - name: Validate Pricing API image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" \
            --secret id=github_token,env=GITHUB_TOKEN \
            -f src/Dhole.Pricing.Api/Dockerfile \
            -t dhole/pricing-api:editable-client-executive-validation \
            .

      - name: Validate Pricing Workers image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" \
            --secret id=github_token,env=GITHUB_TOKEN \
            -f src/Dhole.Pricing.Workers/Dockerfile \
            -t dhole/pricing-workers:editable-client-executive-validation \
            .

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-editable-client-executive-20260828.yml
          rm -f .github/scripts/apply_editable_client_executive_20260828.py
          rm -f .github/scripts/fix_editable_client_executive_projection_20260828.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(pricing): persist editable client executive snapshots'
          git push origin HEAD:master
