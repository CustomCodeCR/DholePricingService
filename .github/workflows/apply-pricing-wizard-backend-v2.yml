name: Apply pricing wizard backend upgrades v2

on:
  push:
    paths:
      - '.github/workflows/apply-pricing-wizard-backend-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply backend patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('.github/workflows/apply-imported-rate-validity-fix.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = helper.index(start_marker) + len(start_marker)
          end = helper.index(end_marker, start)
          block = helper[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(script, '<embedded-pricing-patch>', 'exec'), {'__name__': '__main__'})

          # Expression trees cannot skip optional constructor args with a late named argument.
          # Supply every select DTO field positionally so SpaceComment reaches Web cleanly.
          path = Path('src/Dhole.Pricing.Persistence/Repositories/ImportFclRateRepository.cs')
          text = path.read_text(encoding='utf-8')
          old = '''                x.RawDataJson ?? "{}",\n                x.Status.ToString(),\n                x.UsedAsRateCount,\n                SpaceComment: x.SpaceComment\n            ))'''
          new = '''                x.RawDataJson ?? "{}",\n                x.Status.ToString(),\n                x.UsedAsRateCount,\n                x.PolId,\n                x.PoeId,\n                x.PoeName,\n                x.PodId,\n                x.CarrierId,\n                x.ContainerTypeId,\n                x.ContainerTypeCode,\n                x.CurrencyId,\n                x.TotalSale,\n                x.TransitDays,\n                x.SpaceComment\n            ))'''
          if old not in text:
              raise SystemExit('Import select projection from v1 patch was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # All list/dashboard/search paths must tolerate a missing POD too.
          path = Path('src/Dhole.Pricing.Persistence/Repositories/RateHeaderRepository.cs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('''                || x.PodName.ToLower().Contains(value)\n                || x.PodCode.ToLower().Contains(value)''', '''                || (x.PodName ?? string.Empty).ToLower().Contains(value)\n                || (x.PodCode ?? string.Empty).ToLower().Contains(value)''', 1)
          text = text.replace('''        string podCode,\n        string containerTypeCode,''', '''        string? podCode,\n        string containerTypeCode,''', 1)
          old_route = '''        var route = string.IsNullOrWhiteSpace(poeCode)\n            ? $"{polCode} → {podCode}"\n            : $"{polCode} → {poeCode} → {podCode}";'''
          new_route = '''        var route = string.IsNullOrWhiteSpace(podCode)\n            ? $"{polCode} → {poeCode}"\n            : string.IsNullOrWhiteSpace(poeCode)\n                ? $"{polCode} → {podCode}"\n                : $"{polCode} → {poeCode} → {podCode}";'''
          if old_route not in text:
              raise SystemExit('RateHeaderRepository route label block not found')
          text = text.replace(old_route, new_route, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('src/Dhole.Pricing.Contracts/Rates/Response/PricingRateDashboardDto.cs')
          text = path.read_text(encoding='utf-8')
          if '    string PodName,\n' not in text:
              raise SystemExit('Pricing dashboard POD field not found')
          path.write_text(text.replace('    string PodName,\n', '    string? PodName,\n', 1), encoding='utf-8')
          PY

      - name: Verify Pricing build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Api/Dockerfile -t dhole/pricing-api:verify .

      - name: Commit backend upgrades
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-imported-rate-validity-fix.yml
          git rm .github/workflows/apply-pricing-wizard-backend-v2.yml
          git add src
          git commit -m "feat(pricing): make POD optional and expose rate comments"
          git push origin HEAD:master
