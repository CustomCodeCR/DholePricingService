name: Fix commercial term UUID

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-commercial-term-uuid.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix invalid UUID and validate migration UUIDs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import uuid

          path = Path('src/Dhole.Pricing.Persistence/Migrations/20260825233000_AddCostaRicaCommercialTermRules.cs')
          source = path.read_text(encoding='utf-8')

          bad = '2e1139d8-38ad-4e3b-8a11-aa83ad641dc7b'
          good = '2e1139d8-38ad-4e3b-8a11-aa83ad641dc7'
          if bad not in source:
              raise SystemExit('Expected invalid UUID was not found')

          source = source.replace(bad, good)

          for value in re.findall(r"'([^']+)'::uuid", source):
              try:
                  uuid.UUID(value)
              except ValueError as exc:
                  raise SystemExit(f'Invalid UUID remains in migration: {value}') from exc

          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Dhole.Pricing.Persistence/Migrations/20260825233000_AddCostaRicaCommercialTermRules.cs
          git diff --cached --check
          git commit -m 'fix(pricing): correct commercial term item uuid'
          git push origin master
