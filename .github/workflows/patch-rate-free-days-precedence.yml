name: Patch Pricing free-day precedence

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/patch-rate-free-days-precedence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Prefer quoted free days over carrier fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Dhole.Pricing.Api/Endpoints/RateEndpoints.cs')
          text = path.read_text()
          old = '''        if (!carrierId.HasValue || carrierId.Value == Guid.Empty) return Math.Max(0, fallback);

        var connection = db.Database.GetDbConnection();'''
          new = '''        // Los días libres informados por la tarifa seleccionada son la fuente principal.
        // La regla por naviera se usa únicamente como fallback cuando la tarifa no informa días.
        if (fallback > 0) return Math.Max(0, fallback);
        if (!carrierId.HasValue || carrierId.Value == Guid.Empty) return 0;

        var connection = db.Database.GetDbConnection();'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one free-day precedence anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Maurice Lang"
          git config user.email "106346768+MauLang18@users.noreply.github.com"
          rm .github/workflows/patch-rate-free-days-precedence.yml
          git add src/Dhole.Pricing.Api/Endpoints/RateEndpoints.cs .github/workflows/patch-rate-free-days-precedence.yml
          git commit -m "fix(pricing): prefer rate free days over carrier fallback"
          git push origin HEAD:develop
