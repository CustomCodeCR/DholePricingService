name: Deploy Dhole Pricing - Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: dhole-pricing-staging
  cancel-in-progress: false
env:
  COMPOSE_FILE: .dhole-system/deploy/docker-compose.services.yml
  COMPOSE_OVERRIDE: .dhole-system/deploy/docker-compose.staging.yml
  DHOLE_IMAGE_TAG: staging
  DHOLE_NETWORK: dhole-staging
  COMPOSE_PROJECT: dhole-staging
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - name: Load Dhole deployment infrastructure
        run: |
          set -euo pipefail
          rm -rf .dhole-system
          git clone --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system
          mkdir -p "$RUNNER_TEMP/dhole-env"
          bash .dhole-system/deploy/prepare-environments.sh /opt/dhole/.env "$RUNNER_TEMP/dhole-env"
          echo "DHOLE_ENV_FILE=$RUNNER_TEMP/dhole-env/.env.staging" >> "$GITHUB_ENV"
      - name: Verify staging server
        run: docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" config -q
      - name: Build images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Api/Dockerfile -t dhole/pricing-api:staging -t "dhole/pricing-api:staging-$SHA_TAG" .
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Workers/Dockerfile -t dhole/pricing-workers:staging -t "dhole/pricing-workers:staging-$SHA_TAG" .
      - name: Deploy Pricing staging
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" up -d --no-deps --force-recreate --pull never pricing-api pricing-workers
      - name: Verify Pricing API health
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" ps -q pricing-api)"
          test -n "$CONTAINER_ID"
          for attempt in $(seq 1 18); do
            STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER_ID")"
            if [ "$STATUS" = "healthy" ]; then exit 0; fi
            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ] || [ "$STATUS" = "unhealthy" ]; then docker logs --tail 200 "$CONTAINER_ID" || true; exit 1; fi
            sleep 5
          done
          docker logs --tail 200 "$CONTAINER_ID" || true
          exit 1
      - name: Verify pricing client quote report
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" ps -q pricing-api)"
          test -n "$CONTAINER_ID"
          docker exec "$CONTAINER_ID" sh -ec '
            REPORTS_URL="${Reports__Client__BaseAddress:-http://reports-api:5208}"
            REPORTS_HEADER="${Reports__Client__InternalServiceKeyHeader:-X-Dhole-Service-Key}"
            REPORTS_KEY="${Reports__Client__InternalServiceKey:-dhole-local-reports-service-key-change-in-production}"
            HTTP_CODE="$(curl --silent --show-error -H "Content-Type: application/json" -H "$REPORTS_HEADER: $REPORTS_KEY" --data "{\"format\":\"pdf\",\"dataJson\":{\"company\":{\"name\":\"Grupo Castro Fallas\"},\"generated\":{\"date\":\"30/08/2026\"},\"rate\":{\"quoteNumber\":\"STAGING-SMOKE\",\"clientName\":\"Validación Dhole\",\"route\":\"Origen → Destino\",\"carrier\":\"Naviera\",\"containerSummary\":\"1 x 40 HC\",\"transitTime\":\"Por confirmar\",\"freeDays\":0,\"validFrom\":\"30/08/2026\",\"validTo\":\"30/09/2026\",\"total\":\"USD 0.00\",\"includes\":\"\",\"subjectTo\":\"\",\"excludes\":\"\"},\"items\":[]},\"fileName\":\"pricing-staging-smoke-test\",\"sheetName\":\"Tarifa\"}" "$REPORTS_URL/api/internal/reports/templates/pricing-fcl-client-quote/generate" --output /tmp/pricing-smoke-test.pdf --write-out "%{http_code}")"
            [ "$HTTP_CODE" = "200" ]
            test -s /tmp/pricing-smoke-test.pdf
            head -c 4 /tmp/pricing-smoke-test.pdf | grep -q "%PDF"
            rm -f /tmp/pricing-smoke-test.pdf
          '
      - name: Cleanup old images
        if: always()
        run: docker image prune -f
