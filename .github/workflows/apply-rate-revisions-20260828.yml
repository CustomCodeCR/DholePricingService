name: Apply Rate Revisions 20260828

on:
  push:
    branches: [feature/rate-wizard-revisions-20260828]
    paths:
      - '.github/scripts/apply-rate-revisions-20260828.py'
      - '.github/scripts/fix-rate-revision-worker-20260828.py'
      - '.github/workflows/apply-rate-revisions-20260828.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Repair workspace permissions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE"
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" alpine:3.22 sh -c "chown -R $(id -u):$(id -g) /workspace"

      - uses: actions/checkout@v4
        with:
          ref: feature/rate-wizard-revisions-20260828
          fetch-depth: 0

      - name: Apply implementation
        run: |
          python3 .github/scripts/apply-rate-revisions-20260828.py
          python3 .github/scripts/fix-rate-revision-worker-20260828.py

      - name: Restore build and generate EF migration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e DOTNET_CLI_HOME=/tmp \
            -e NUGET_PACKAGES=/tmp/.nuget/packages \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e GITHUB_ACTOR="$GITHUB_ACTOR" \
            -v "$PWD:/src" -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            sh -ec '
              cp NuGet.Config /tmp/NuGet.Config
              dotnet nuget update source github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile /tmp/NuGet.Config
              dotnet restore src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj --configfile /tmp/NuGet.Config
              dotnet restore src/Dhole.Pricing.Workers/Dhole.Pricing.Workers.csproj --configfile /tmp/NuGet.Config
              dotnet build src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj -c Release --no-restore
              dotnet build src/Dhole.Pricing.Workers/Dhole.Pricing.Workers.csproj -c Release --no-restore
              dotnet tool install --tool-path /tmp/tools dotnet-ef --version 10.0.9
              /tmp/tools/dotnet-ef migrations add AddRateRevisions20260829 \
                --project src/Dhole.Pricing.Persistence/Dhole.Pricing.Persistence.csproj \
                --startup-project src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj \
                --context ServiceDbContext \
                --configuration Release \
                --no-build
              dotnet build src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj -c Release --no-restore
              dotnet build src/Dhole.Pricing.Workers/Dhole.Pricing.Workers.csproj -c Release --no-restore
            '

      - name: Build production images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Api/Dockerfile -t dhole/pricing-revisions-api-validation .
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Workers/Dockerfile -t dhole/pricing-revisions-worker-validation .

      - name: Commit implementation and migration
        run: |
          set -euo pipefail
          git config user.name 'Maurice Lang'
          git config user.email '106346768+MauLang18@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'feat(pricing): preserve accepted rate revisions'
          git push origin HEAD:feature/rate-wizard-revisions-20260828
