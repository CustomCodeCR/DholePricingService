name: Apply Sep 03 Pricing fixes

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/apply-sep03-pricing-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply Pricing changes
        run: python3 .github/scripts/apply-sep03-pricing-fixes.py

      - name: Validate patch
        run: |
          git diff --check
          git status --short

      - name: Commit Pricing changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/Dhole.Pricing.Api/Endpoints/OwnLclPricingLineCatalog.cs \
            src/Dhole.Pricing.Api/Endpoints/OwnLclFobScenarioEndpoints.cs \
            src/Dhole.Pricing.Api/Endpoints/OwnLclRouteMatrixV2Endpoints.cs \
            src/Dhole.Pricing.Infrastructure/Reports/RateReportDataFactory.cs \
            src/Dhole.Pricing.Persistence/Migrations/20260903210000_AddOwnLclConsolidationPricingLines.cs
          git commit -m "feat(pricing): configure own LCL costs and hide carrier in LCL reports"
          git push origin HEAD:develop
