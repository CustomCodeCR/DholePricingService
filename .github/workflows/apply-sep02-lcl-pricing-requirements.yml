name: Apply Sep 02 LCL pricing requirements

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-sep02-lcl-pricing-requirements.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Pricing patch
        run: python .github/scripts/patch_sep02_lcl_pricing_requirements.py

      - name: Validate Pricing API build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Api/Dockerfile -t dhole/pricing-sep02-validation .

      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-sep02-lcl-pricing-requirements.yml
          rm -f .github/scripts/patch_sep02_lcl_pricing_requirements.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(pricing): implement Sep 02 LCL pricing requirements'
          git push origin develop
