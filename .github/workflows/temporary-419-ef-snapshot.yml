name: One-time 419 EF Snapshot Generator (feature branch only)
on:
  push:
    branches:
      - feature/DH-20261123-OPS-AUTO-419
    paths:
      - .github/workflows/temporary-419-ef-snapshot.yml
permissions:
  contents: write
  packages: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate exact EF snapshot for current model
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export NuGetPackageSourceCredentials_github="Username=${GITHUB_ACTOR};Password=${GITHUB_TOKEN};ValidAuthenticationTypes=Basic"
          dotnet restore src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj --configfile NuGet.Config
          dotnet build src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj --no-restore -c Release --verbosity minimal
          dotnet tool install --tool-path "${RUNNER_TEMP}/ef" dotnet-ef --version 10.0.9
          "${RUNNER_TEMP}/ef/dotnet-ef" migrations add SnapshotSync419Temporary --no-build --configuration Release \
            --project src/Dhole.Pricing.Persistence/Dhole.Pricing.Persistence.csproj \
            --startup-project src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj
          git status --short
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Dhole.Pricing.Persistence/Migrations/ServiceDbContextModelSnapshot.cs
          git commit -m "fix(pricing): generate accurate EF snapshot for Operations reviews" || exit 0
          git push origin HEAD:feature/DH-20261123-OPS-AUTO-419
