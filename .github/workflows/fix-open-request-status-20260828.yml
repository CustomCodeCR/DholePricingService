name: Apply open request transition

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-open-request-status-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/fix_open_request_status_20260828.py

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-open-request-status-20260828.yml
          rm -f .github/scripts/fix_open_request_status_20260828.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pricing): save pending requests as open"
          git push origin HEAD:master
