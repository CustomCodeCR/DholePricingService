name: Apply commercial rule integration

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-commercial-rules.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate commercial rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          program = Path('src/Dhole.Pricing.Api/Program.cs')
          source = program.read_text(encoding='utf-8')
          marker = 'app.MapPricingRuleConfigurationEndpoints();\n'
          if 'app.MapCommercialTermEndpoints();' not in source:
              if marker not in source:
                  raise SystemExit('Program marker not found')
              source = source.replace(marker, marker + 'app.MapCommercialTermEndpoints();\n', 1)
              program.write_text(source, encoding='utf-8')

          resolver = Path('src/Dhole.Pricing.Application/Services/RateExtraDetailResolver.cs')
          source = resolver.read_text(encoding='utf-8')

          old_guard = '''            || !input.Notes.StartsWith(\n                "Seguro de carga · valor carga USD",\n                StringComparison.OrdinalIgnoreCase\n            )\n'''
          new_guard = '''            || !(\n                input.Notes.StartsWith(\n                    "Seguro de carga · valor FOB USD",\n                    StringComparison.OrdinalIgnoreCase\n                )\n                || input.Notes.StartsWith(\n                    "Seguro de carga · valor carga USD",\n                    StringComparison.OrdinalIgnoreCase\n                )\n            )\n'''
          if old_guard in source:
              source = source.replace(old_guard, new_guard, 1)

          old_values = '''        var cargoValue = ReadDecimal(input.Notes, @"valor carga USD\\s+([0-9]+(?:[.,][0-9]+)?)");\n        if (!cargoValue.HasValue || cargoValue.Value <= 0m)\n        {\n            return (input.CostAmount, input.SaleAmount);\n        }\n\n        var salePercentage =\n            ReadDecimal(input.Notes, @"·\\s*([0-9]+(?:[.,][0-9]+)?)%")\n            ?? CargoInsurancePricingRules.DefaultSalePercentage;\n'''
          new_values = '''        var cargoValue =\n            ReadDecimal(input.Notes, @"valor FOB USD\\s+([0-9]+(?:[.,][0-9]+)?)")\n            ?? ReadDecimal(input.Notes, @"valor carga USD\\s+([0-9]+(?:[.,][0-9]+)?)");\n        if (!cargoValue.HasValue || cargoValue.Value <= 0m)\n        {\n            return (input.CostAmount, input.SaleAmount);\n        }\n\n        var freightAmount =\n            ReadDecimal(input.Notes, @"flete USD\\s+([0-9]+(?:[.,][0-9]+)?)") ?? 0m;\n        var salePercentage =\n            ReadDecimal(input.Notes, @"tasa\\s+([0-9]+(?:[.,][0-9]+)?)%")\n            ?? ReadDecimal(input.Notes, @"·\\s*([0-9]+(?:[.,][0-9]+)?)%")\n            ?? CargoInsurancePricingRules.DefaultSalePercentage;\n'''
          if old_values not in source:
              raise SystemExit('Insurance value parser marker not found')
          source = source.replace(old_values, new_values, 1)

          old_call = '''        var calculated = CargoInsurancePricingRules.Calculate(\n            cargoValue.Value,\n            salePercentage,\n            saleMinimum,\n            manualSaleAmount\n        );\n'''
          new_call = '''        var calculated = CargoInsurancePricingRules.Calculate(\n            cargoValue.Value,\n            freightAmount,\n            salePercentage,\n            saleMinimum,\n            manualSaleAmount\n        );\n'''
          if old_call not in source:
              raise SystemExit('Insurance calculate marker not found')
          source = source.replace(old_call, new_call, 1)
          resolver.write_text(source, encoding='utf-8')
          PY

      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Dhole.Pricing.Api/Program.cs src/Dhole.Pricing.Application/Services/RateExtraDetailResolver.cs
          git diff --cached --check
          git commit -m 'feat(pricing): integrate commercial terms and insurance'
          git push origin master
