name: Apply LCL WHSE Route Fix

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/apply-lcl-whse-route-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Patch active own-LCL route matrix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Dhole.Pricing.Api/Endpoints/OwnLclRouteMatrixV2Endpoints.cs')
          text = path.read_text(encoding='utf-8')

          call_anchor = '''        AddOriginLines(
              lines,
              incoterm,
              billableCbm,'''
          call_replacement = '''        AddOriginLines(
              lines,
              incoterm,
              requestedPol,
              billableCbm,'''
          if text.count(call_anchor) != 1:
              raise SystemExit(f'Expected exactly one AddOriginLines call anchor, found {text.count(call_anchor)}')
          text = text.replace(call_anchor, call_replacement, 1)

          signature_anchor = '''    private static void AddOriginLines(
              List<OwnLclQuoteLine> lines,
              string incoterm,
              decimal cbm,'''
          signature_replacement = '''    private static void AddOriginLines(
              List<OwnLclQuoteLine> lines,
              string incoterm,
              string originPol,
              decimal cbm,'''
          if text.count(signature_anchor) != 1:
              raise SystemExit(f'Expected exactly one AddOriginLines signature anchor, found {text.count(signature_anchor)}')
          text = text.replace(signature_anchor, signature_replacement, 1)

          whse_anchor = '''        AddConfiguredLine(lines, pricingLines, "ORIGIN_CFS", cbm);
          AddConfiguredLine(lines, pricingLines, "ORIGIN_WHSE", cbm);
          AddConfiguredLine(lines, pricingLines, "ORIGIN_CUSTOMS", sets);'''
          whse_replacement = '''        AddConfiguredLine(lines, pricingLines, "ORIGIN_CFS", cbm);

          // WHSE FEE applies only when the commercial POL is Shanghai. For Ningbo,
          // Qingdao and the other China origins, warehouse is already included in
          // the negotiated origin differential and must not be charged again.
          if (string.Equals(originPol, "SHANGHAI", StringComparison.OrdinalIgnoreCase))
              AddConfiguredLine(lines, pricingLines, "ORIGIN_WHSE", cbm);

          AddConfiguredLine(lines, pricingLines, "ORIGIN_CUSTOMS", sets);'''
          if text.count(whse_anchor) != 1:
              raise SystemExit(f'Expected exactly one WHSE anchor, found {text.count(whse_anchor)}')
          text = text.replace(whse_anchor, whse_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Maurice Lang"
          git config user.email "106346768+MauLang18@users.noreply.github.com"
          git rm .github/workflows/apply-lcl-whse-route-fix.yml
          git add src/Dhole.Pricing.Api/Endpoints/OwnLclRouteMatrixV2Endpoints.cs
          git commit -m "fix(pricing): apply WHSE rule to active LCL route matrix"
          git push origin HEAD:develop
