name: Normalize Pricing commercial categories

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/normalize-pricing-commercial-categories-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Pricing corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          worker_path = Path('src/Dhole.Pricing.Workers/Workers/PricingRateExpirationWorker.cs')
          worker = worker_path.read_text(encoding='utf-8-sig')
          worker = replace_once(
              worker,
              """        var rates = await dbContext
            .RateHeaders.Where(rate =>
                !rate.IsDeleted
                && rate.ValidTo < todayUtc
                && rate.Status != RateStatus.Expired
                && rate.Status != RateStatus.Closed
                && rate.Status != RateStatus.RejectedByManagement
                && rate.Status != RateStatus.RejectedByClient
            )
""",
              """        var rates = await dbContext
            .RateHeaders.Where(rate =>
                !rate.IsDeleted
                && rate.ValidTo < todayUtc
                && rate.Status == RateStatus.Sent
            )
""",
              'expire only sent rates',
          )
          worker = replace_once(
              worker,
              'No hay tarifas vigentes pendientes de marcar como vencidas.',
              'No hay tarifas enviadas pendientes de marcar como vencidas.',
              'expiration log semantics',
          )
          worker_path.write_text(worker, encoding='utf-8')

          repo_path = Path('src/Dhole.Pricing.Persistence/Repositories/RateHeaderRepository.cs')
          repo = repo_path.read_text(encoding='utf-8-sig')
          repo = replace_once(
              repo,
              """        if (status.HasValue)
        {
            query = query.Where(x => x.Status == status.Value);
        }
""",
              """        if (status.HasValue)
        {
            query = status.Value switch
            {
                RateStatus.Open => query.Where(x =>
                    x.Status == RateStatus.Open
                    || x.Status == RateStatus.PendingApproval
                    || x.Status == RateStatus.ApprovedByManagement
                    || x.Status == RateStatus.RejectedByManagement
                    || x.Status == RateStatus.RequestedByClient
                ),
                RateStatus.RejectedByClient => query.Where(x =>
                    x.Status == RateStatus.RejectedByClient || x.Status == RateStatus.Closed
                ),
                _ => query.Where(x => x.Status == status.Value),
            };
        }
""",
              'commercial grouped filtering',
          )

          old_statuses = """        var statuses = Enum.GetValues<RateStatus>()
            .Select(status =>
            {
                var count = statusCounts.GetValueOrDefault(status);
                var percentage = totalRates == 0
                    ? 0m
                    : Math.Round(count * 100m / totalRates, 2, MidpointRounding.AwayFromZero);

                return new PricingRateStatusSummaryDto(status.ToString(), count, percentage);
            })
            .ToList();
"""
          new_statuses = """        var openCount =
            statusCounts.GetValueOrDefault(RateStatus.PendingApproval)
            + statusCounts.GetValueOrDefault(RateStatus.ApprovedByManagement)
            + statusCounts.GetValueOrDefault(RateStatus.RejectedByManagement)
            + statusCounts.GetValueOrDefault(RateStatus.Open)
            + statusCounts.GetValueOrDefault(RateStatus.RequestedByClient);
        var sentCount = statusCounts.GetValueOrDefault(RateStatus.Sent);
        var expiredCount = statusCounts.GetValueOrDefault(RateStatus.Expired);
        var acceptedCount = statusCounts.GetValueOrDefault(RateStatus.AcceptedByClient);
        var notAcceptedCount =
            statusCounts.GetValueOrDefault(RateStatus.RejectedByClient)
            + statusCounts.GetValueOrDefault(RateStatus.Closed);

        var commercialStatusCounts = new[]
        {
            (Status: RateStatus.Open, Count: openCount),
            (Status: RateStatus.Sent, Count: sentCount),
            (Status: RateStatus.Expired, Count: expiredCount),
            (Status: RateStatus.AcceptedByClient, Count: acceptedCount),
            (Status: RateStatus.RejectedByClient, Count: notAcceptedCount),
        };

        var statuses = commercialStatusCounts
            .Select(item =>
            {
                var percentage = totalRates == 0
                    ? 0m
                    : Math.Round(item.Count * 100m / totalRates, 2, MidpointRounding.AwayFromZero);

                return new PricingRateStatusSummaryDto(item.Status.ToString(), item.Count, percentage);
            })
            .ToList();
"""
          repo = replace_once(repo, old_statuses, new_statuses, 'dashboard five category summaries')

          old_return = """        return new PricingRateDashboardDto(
            totalRates,
            statusCounts.GetValueOrDefault(RateStatus.PendingApproval),
            statusCounts.GetValueOrDefault(RateStatus.ApprovedByManagement),
            statusCounts.GetValueOrDefault(RateStatus.RejectedByManagement)
                + statusCounts.GetValueOrDefault(RateStatus.RejectedByClient),
            statusCounts.GetValueOrDefault(RateStatus.Open),
            statusCounts.GetValueOrDefault(RateStatus.Sent),
            statusCounts.GetValueOrDefault(RateStatus.RequestedByClient),
            statusCounts.GetValueOrDefault(RateStatus.AcceptedByClient),
            statusCounts.GetValueOrDefault(RateStatus.Closed),
            statusCounts.GetValueOrDefault(RateStatus.Expired),
            lastCreatedAtUtc,
            lastModifiedAtUtc,
            statuses,
            financials,
            recentRates
        );
"""
          new_return = """        return new PricingRateDashboardDto(
            totalRates,
            statusCounts.GetValueOrDefault(RateStatus.PendingApproval),
            statusCounts.GetValueOrDefault(RateStatus.ApprovedByManagement),
            notAcceptedCount,
            openCount,
            sentCount,
            statusCounts.GetValueOrDefault(RateStatus.RequestedByClient),
            acceptedCount,
            statusCounts.GetValueOrDefault(RateStatus.Closed),
            expiredCount,
            lastCreatedAtUtc,
            lastModifiedAtUtc,
            statuses,
            financials,
            recentRates
        );
"""
          repo = replace_once(repo, old_return, new_return, 'dashboard grouped counts')
          repo_path.write_text(repo, encoding='utf-8')
          PY
          git diff --check

      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/normalize-pricing-commercial-categories-20260828.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pricing): enforce five commercial rate categories"
          git push origin HEAD:master
