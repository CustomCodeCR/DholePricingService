name: Deploy Dhole Pricing
# Pricing wizard release trigger — 2026-08-27

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dhole-pricing-deploy
  cancel-in-progress: false

env:
  COMPOSE_FILE: /opt/dhole/docker-compose.services.yml

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]

    steps:
      - name: Checkout service
        uses: actions/checkout@v4

      - name: Verify server
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker network inspect dhole >/dev/null
          test -r /opt/dhole/.env
          test -r "$COMPOSE_FILE"
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" config -q

      - name: Build images
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Api/Dockerfile -t dhole/pricing-api:latest -t "dhole/pricing-api:$SHA_TAG" .
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Workers/Dockerfile -t dhole/pricing-workers:latest -t "dhole/pricing-workers:$SHA_TAG" .

      - name: Deploy Pricing
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" up -d --no-deps --force-recreate --pull never pricing-api pricing-workers
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" ps pricing-api pricing-workers

      - name: Verify Pricing API health
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" ps -q pricing-api)"
          test -n "$CONTAINER_ID"
          for attempt in $(seq 1 18); do
            STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER_ID")"
            echo "Pricing API status: $STATUS (attempt $attempt/18)"
            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi
            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ] || [ "$STATUS" = "unhealthy" ]; then
              docker logs --tail 200 "$CONTAINER_ID" || true
              exit 1
            fi
            sleep 5
          done
          docker logs --tail 200 "$CONTAINER_ID" || true
          echo "Pricing API did not become healthy in time."
          exit 1

      - name: Verify pricing client quote report
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" ps -q pricing-api)"
          test -n "$CONTAINER_ID"
          docker exec "$CONTAINER_ID" sh -ec '
            REPORTS_URL="${Reports__Client__BaseAddress:-http://reports-api:5208}"
            REPORTS_HEADER="${Reports__Client__InternalServiceKeyHeader:-X-Dhole-Service-Key}"
            REPORTS_KEY="${Reports__Client__InternalServiceKey:-dhole-local-reports-service-key-change-in-production}"
            HTTP_CODE="$(curl --silent --show-error \
              -H "Content-Type: application/json" \
              -H "$REPORTS_HEADER: $REPORTS_KEY" \
              --data "{\"format\":\"pdf\",\"dataJson\":{\"company\":{\"name\":\"Grupo Castro Fallas\",\"website\":\"https://logisticacastrofallas.com\"},\"generated\":{\"date\":\"27/08/2026\"},\"rate\":{\"quoteNumber\":\"SMOKE-TEST\",\"clientName\":\"Validación Dhole\",\"route\":\"Origen → Destino\",\"carrier\":\"Naviera\",\"containerSummary\":\"1 x 40 HC\",\"transitTime\":\"Por confirmar\",\"freeDays\":0,\"validFrom\":\"27/08/2026\",\"validTo\":\"27/09/2026\",\"total\":\"USD 0.00\",\"includes\":\"\",\"subjectTo\":\"\",\"excludes\":\"\"},\"items\":[]},\"fileName\":\"pricing-smoke-test\",\"sheetName\":\"Tarifa\"}" \
              "$REPORTS_URL/api/internal/reports/templates/pricing-fcl-client-quote/generate" \
              --output /tmp/pricing-smoke-test.pdf \
              --write-out "%{http_code}")"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Reports devolvió HTTP $HTTP_CODE para pricing-fcl-client-quote"
              cat /tmp/pricing-smoke-test.pdf
              exit 1
            fi
            test -s /tmp/pricing-smoke-test.pdf
            head -c 4 /tmp/pricing-smoke-test.pdf | grep -q "%PDF"
            rm -f /tmp/pricing-smoke-test.pdf
          '

      - name: Cleanup old images
        continue-on-error: true
        run: docker image prune -f
