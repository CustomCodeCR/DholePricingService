name: Deploy Dhole Pricing

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhole-pricing-deploy
  cancel-in-progress: true

env:
  COMPOSE_FILE: /opt/dhole/docker-compose.services.yml

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]

    steps:
      - name: Checkout service
        uses: actions/checkout@v4

      - name: Verify server
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker network inspect dhole >/dev/null
          test -r /opt/dhole/.env
          test -r "$COMPOSE_FILE"
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" config -q

      - name: Build images
        shell: bash
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull -f src/Dhole.Pricing.Api/Dockerfile -t dhole/pricing-api:latest -t "dhole/pricing-api:$SHA_TAG" .
          docker build --pull -f src/Dhole.Pricing.Workers/Dockerfile -t dhole/pricing-workers:latest -t "dhole/pricing-workers:$SHA_TAG" .

      - name: Deploy Pricing
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" up -d --no-deps --force-recreate --pull never pricing-api pricing-workers
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" ps pricing-api pricing-workers

      - name: Cleanup old images
        run: docker image prune -f
