name: Validate Average Competitor Import Review

on:
  push:
    branches: [feature/average-competitor-pdf-review-flag]
  pull_request:
    branches: [develop, master]
    paths:
      - 'src/Dhole.Pricing.Api/Services/CompetitorTariffImportQueue.cs'
      - 'tests/Dhole.Pricing.CompetitorPdfTests/CompetitorPdfManualReviewTests.cs'
      - 'tests/Dhole.Pricing.CompetitorPdfTests/Dhole.Pricing.CompetitorPdfTests.csproj'
      - '.github/workflows/validate-average-competitor-import.yml'

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run competitor review tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export NuGetPackageSourceCredentials_github="Username=${GITHUB_ACTOR};Password=${GITHUB_TOKEN};ValidAuthenticationTypes=Basic"
          dotnet restore tests/Dhole.Pricing.CompetitorPdfTests/Dhole.Pricing.CompetitorPdfTests.csproj --configfile NuGet.Config
          dotnet test tests/Dhole.Pricing.CompetitorPdfTests/Dhole.Pricing.CompetitorPdfTests.csproj -c Release --no-restore --filter "FullyQualifiedName~CompetitorPdfManualReviewTests" --verbosity normal
