name: Apply Hacienda model snapshot fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-hacienda-model-snapshot-20260828.yml'

permissions:
  contents: write
  packages: read

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize EF model snapshot
        run: python .github/scripts/patch_hacienda_model_snapshot_20260828.py

      - name: Validate Pricing API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Api/Dockerfile -t dhole/pricing-hacienda-snapshot-api-validation .

      - name: Validate Pricing Worker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Workers/Dockerfile -t dhole/pricing-hacienda-snapshot-worker-validation .

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-hacienda-model-snapshot-20260828.yml
          rm -f .github/scripts/patch_hacienda_model_snapshot_20260828.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(pricing): sync Hacienda fields in EF model snapshot'
          git push origin master
