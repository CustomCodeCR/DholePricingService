name: Fix TEU container allocation reference

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-teu-container-reference.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout pricing
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply TEU fix
        shell: bash
        run: python3 .github/scripts/fix_teu_container_reference.py

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-teu-container-reference.yml
          rm -f .github/scripts/fix_teu_container_reference.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pricing): calculate TEU from rate containers"
          git push origin HEAD:master
