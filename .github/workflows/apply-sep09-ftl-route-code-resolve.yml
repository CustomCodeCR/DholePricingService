name: Apply FTL Route Code Resolve

on:
  push:
    branches: [master, develop]
    paths: ['.github/workflows/apply-sep09-ftl-route-code-resolve.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch FTL resolver
        shell: bash
        run: |
          echo '' | base64 -d | python
      - name: Commit permanent resolver change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-sep09-ftl-route-code-resolve.yml
          git add src/Dhole.Pricing.Api/Endpoints/FtlTariffEndpoints.cs
          git commit -m 'fix(pricing): match FTL routes by catalog codes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
