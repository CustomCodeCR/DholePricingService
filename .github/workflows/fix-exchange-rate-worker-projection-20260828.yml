name: Fix exchange-rate worker projection

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-exchange-rate-worker-projection-20260828.yml'

permissions:
  contents: write
  packages: read

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch worker projection
        run: python .github/scripts/fix_exchange_rate_worker_projection_20260828.py

      - name: Validate API and worker builds
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker build --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Api/Dockerfile -t dhole/pricing-exchange-api-validation .
          docker build --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Workers/Dockerfile -t dhole/pricing-exchange-worker-validation .

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-exchange-rate-worker-projection-20260828.yml
          rm -f .github/scripts/fix_exchange_rate_worker_projection_20260828.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(pricing): include exchange rate in worker cache projection'
          git push origin master
