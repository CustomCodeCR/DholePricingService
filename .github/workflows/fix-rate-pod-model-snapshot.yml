name: Repair optional POD model snapshot

on:
  push:
    paths:
      - '.github/workflows/fix-rate-pod-model-snapshot.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout service
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair EF model snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Dhole.Pricing.Persistence/Migrations/ServiceDbContextModelSnapshot.cs')
          text = path.read_text(encoding='utf-8-sig')

          marker = 'modelBuilder.Entity("Dhole.Pricing.Domain.Rates.Entities.RateHeader", b =>'
          start = text.index(marker)
          end_marker = '                    b.ToTable("RateHeaders", "pricing");'
          end = text.index(end_marker, start) + len(end_marker)
          block = text[start:end]

          old_pod_id = '''                    b.Property<Guid>("PodId")\n                        .HasColumnType("uuid")\n                        .HasColumnName("pod_id");'''
          new_pod_id = '''                    b.Property<Guid?>("PodId")\n                        .HasColumnType("uuid")\n                        .HasColumnName("pod_id");'''
          if old_pod_id not in block:
              raise SystemExit('RateHeader PodId snapshot definition was not found as required')
          block = block.replace(old_pod_id, new_pod_id, 1)

          old_pod_name = '''                    b.Property<string>("PodName")\n                        .IsRequired()\n                        .HasMaxLength(250)\n                        .HasColumnType("character varying(250)")\n                        .HasColumnName("pod_name");'''
          new_pod_name = '''                    b.Property<string>("PodName")\n                        .HasMaxLength(250)\n                        .HasColumnType("character varying(250)")\n                        .HasColumnName("pod_name");'''
          if old_pod_name not in block:
              raise SystemExit('RateHeader PodName snapshot definition was not found as required')
          block = block.replace(old_pod_name, new_pod_name, 1)

          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/fix-rate-pod-model-snapshot.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Dhole.Pricing.Persistence/Migrations/ServiceDbContextModelSnapshot.cs .github/workflows/fix-rate-pod-model-snapshot.yml
          git commit -m "fix(pricing): sync optional POD migration snapshot"
          git push origin HEAD:master
