name: Patch Rate Term Validation 2026-08-27

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-rate-term-validation-20260827.yml'
      - '.github/scripts/patch-rate-term-validation-20260827.py'

permissions:
  contents: write
  packages: read

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch-rate-term-validation-20260827.py

      - name: Build Pricing API image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" \
            --secret id=github_token,env=GITHUB_TOKEN \
            -f src/Dhole.Pricing.Api/Dockerfile \
            -t dhole/pricing-api:validation-patch \
            .

      - name: Commit patch and clean helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/patch-rate-term-validation-20260827.py
          rm -f .github/workflows/patch-rate-term-validation-20260827.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(pricing): validate rate terms across categories only'
          git push origin HEAD:master
