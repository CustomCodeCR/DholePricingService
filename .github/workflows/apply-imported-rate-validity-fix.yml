name: Apply pricing wizard backend upgrades

on:
  push:
    paths:
      - '.github/workflows/apply-imported-rate-validity-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Pricing backend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace(path, old, new, count=None):
              text = read(path)
              actual = text.count(old)
              expected = count if count is not None else 1
              if actual < expected:
                  raise SystemExit(f'{path}: expected at least {expected} occurrence(s), found {actual}: {old[:100]!r}')
              text = text.replace(old, new, expected if count is not None else 1)
              write(path, text)

          # Contracts / commands / DTOs: POD is optional end-to-end.
          for path in [
              'src/Dhole.Pricing.Contracts/Rates/Request/CreateRateRequest.cs',
              'src/Dhole.Pricing.Contracts/Rates/Request/UpdateRateRequest.cs',
              'src/Dhole.Pricing.Application/Features/Rates/CreateRate/CreateRateCommand.cs',
              'src/Dhole.Pricing.Application/Features/Rates/UpdateRate/UpdateRateCommand.cs',
              'src/Dhole.Pricing.Contracts/Rates/Response/RateDto.cs',
          ]:
              text = read(path)
              old = 'Guid PodId,\n    string PodName,\n    string PodCode,'
              if old not in text:
                  raise SystemExit(f'{path}: POD contract block not found')
              text = text.replace(old, 'Guid? PodId,\n    string? PodName,\n    string? PodCode,', 1)
              write(path, text)

          # Domain model: nullable POD, validation only when supplied, and route naming without fake POD.
          path = 'src/Dhole.Pricing.Domain/Rates/Entities/RateHeader.cs'
          text = read(path)
          old_sig = 'Guid podId,\n        string podName,\n        string podCode,'
          sig_count = text.count(old_sig)
          if sig_count < 3:
              raise SystemExit(f'RateHeader: expected POD signature in ctor/Create/Update, found {sig_count}')
          text = text.replace(old_sig, 'Guid? podId,\n        string? podName,\n        string? podCode,')
          text = text.replace(
              'public Guid PodId { get; private set; }\n    public string PodName { get; private set; } = string.Empty;\n    public string PodCode { get; private set; } = string.Empty;',
              'public Guid? PodId { get; private set; }\n    public string? PodName { get; private set; }\n    public string? PodCode { get; private set; }',
              1,
          )
          assignment = 'PodId = podId;\n        PodName = podName.Trim();\n        PodCode = podCode.Trim();'
          if text.count(assignment) < 2:
              raise SystemExit('RateHeader: POD assignments changed unexpectedly')
          text = text.replace(
              assignment,
              'PodId = NormalizeId(podId);\n        PodName = PodId.HasValue ? Normalize(podName) : null;\n        PodCode = PodId.HasValue ? Normalize(podCode) : null;',
          )
          required = '''        if (\n            podId == Guid.Empty\n            || string.IsNullOrWhiteSpace(podName)\n            || string.IsNullOrWhiteSpace(podCode)\n        )\n        {\n            throw new InvalidOperationException("El POD es obligatorio.");\n        }\n'''
          optional = '''        var normalizedPodId = NormalizeId(podId);\n        if (\n            normalizedPodId.HasValue\n            && (string.IsNullOrWhiteSpace(podName) || string.IsNullOrWhiteSpace(podCode))\n        )\n        {\n            throw new InvalidOperationException("El POD seleccionado debe incluir nombre y código.");\n        }\n\n        if (\n            !normalizedPodId.HasValue\n            && (!string.IsNullOrWhiteSpace(podName) || !string.IsNullOrWhiteSpace(podCode))\n        )\n        {\n            throw new InvalidOperationException("El identificador del POD es obligatorio cuando se envía su información.");\n        }\n'''
          if required not in text:
              raise SystemExit('RateHeader: required POD validation block not found')
          text = text.replace(required, optional, 1)
          text = text.replace(
              '        string podName,\n        string? incoterm,',
              '        string? podName,\n        string? incoterm,',
              1,
          )
          old_name = '        var baseName =\n            $"{rateCode} - Tarifa {containerDescription} - {incotermLabel} - {polName} To {podName} Via {via}";'
          new_name = '''        var hasPod = !string.IsNullOrWhiteSpace(podName);\n        var destination = hasPod ? podName!.Trim() : poeName;\n        var route = hasPod && !string.Equals(destination, poeName, StringComparison.OrdinalIgnoreCase)\n            ? $"{polName} To {destination} Via {via}"\n            : $"{polName} To {destination}";\n        var baseName =\n            $"{rateCode} - Tarifa {containerDescription} - {incotermLabel} - {route}";'''
          if old_name not in text:
              raise SystemExit('RateHeader: rate name route block not found')
          text = text.replace(old_name, new_name, 1)
          write(path, text)

          # Config validation: resolve POD only if it was actually selected.
          path = 'src/Dhole.Pricing.Application/Features/Rates/CreateRate/CreateRateCommandHandler.cs'
          text = read(path)
          old = '''            var pod = await configCatalog.GetActiveInGroupAsync(\n                command.PodId, PricingConstants.CatalogSlugs.Pod, cancellationToken);\n            if (pod is null)\n                return Result.Failure<Guid>(PricingErrors.InvalidConfigCatalogReference(\n                    "El POD", PricingConstants.CatalogSlugs.Pod));\n'''
          new = '''            PricingConfigCatalogItem? pod = null;\n            if (command.PodId.HasValue && command.PodId.Value != Guid.Empty)\n            {\n                pod = await configCatalog.GetActiveInGroupAsync(\n                    command.PodId, PricingConstants.CatalogSlugs.Pod, cancellationToken);\n                if (pod is null)\n                    return Result.Failure<Guid>(PricingErrors.InvalidConfigCatalogReference(\n                        "El POD", PricingConstants.CatalogSlugs.Pod));\n            }\n'''
          if old not in text:
              raise SystemExit('CreateRate handler: POD lookup block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '                PodId = pod.Id,\n                PodName = pod.SnapshotName(),\n                PodCode = pod.Code,',
              '                PodId = pod?.Id,\n                PodName = pod?.SnapshotName(),\n                PodCode = pod?.Code,',
              1,
          )
          write(path, text)

          path = 'src/Dhole.Pricing.Application/Features/Rates/UpdateRate/UpdateRateCommandHandler.cs'
          text = read(path)
          old = '''            var pod = await configCatalog.GetActiveInGroupAsync(\n                command.PodId, PricingConstants.CatalogSlugs.Pod, cancellationToken);\n            if (pod is null)\n                return Result.Failure(PricingErrors.InvalidConfigCatalogReference(\n                    "El POD", PricingConstants.CatalogSlugs.Pod));\n'''
          new = '''            PricingConfigCatalogItem? pod = null;\n            if (command.PodId.HasValue && command.PodId.Value != Guid.Empty)\n            {\n                pod = await configCatalog.GetActiveInGroupAsync(\n                    command.PodId, PricingConstants.CatalogSlugs.Pod, cancellationToken);\n                if (pod is null)\n                    return Result.Failure(PricingErrors.InvalidConfigCatalogReference(\n                        "El POD", PricingConstants.CatalogSlugs.Pod));\n            }\n'''
          if old not in text:
              raise SystemExit('UpdateRate handler: POD lookup block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '                PodId = pod.Id,\n                PodName = pod.SnapshotName(),\n                PodCode = pod.Code,',
              '                PodId = pod?.Id,\n                PodName = pod?.SnapshotName(),\n                PodCode = pod?.Code,',
              1,
          )
          write(path, text)

          # EF mapping and snapshot allow NULL for POD columns.
          path = 'src/Dhole.Pricing.Persistence/Configurations/Rates/RateHeaderConfiguration.cs'
          text = read(path)
          text = text.replace('builder.Property(x => x.PodId).IsRequired();', 'builder.Property(x => x.PodId).IsRequired(false);', 1)
          text = text.replace('builder.Property(x => x.PodName).HasMaxLength(250).IsRequired();', 'builder.Property(x => x.PodName).HasMaxLength(250).IsRequired(false);', 1)
          text = text.replace('builder.Property(x => x.PodCode).HasMaxLength(80).IsRequired();', 'builder.Property(x => x.PodCode).HasMaxLength(80).IsRequired(false);', 1)
          write(path, text)

          path = 'src/Dhole.Pricing.Persistence/Migrations/ServiceDbContextModelSnapshot.cs'
          text = read(path)
          text = text.replace('''                    b.Property<string>("PodCode")\n                        .IsRequired()\n                        .HasMaxLength(80)''', '''                    b.Property<string>("PodCode")\n                        .HasMaxLength(80)''', 1)
          text = text.replace('b.Property<Guid>("PodId")\n                        .HasColumnType("uuid")\n                        .HasColumnName("pod_id");', 'b.Property<Guid?>("PodId")\n                        .HasColumnType("uuid")\n                        .HasColumnName("pod_id");', 1)
          text = text.replace('''                    b.Property<string>("PodName")\n                        .IsRequired()\n                        .HasMaxLength(250)''', '''                    b.Property<string>("PodName")\n                        .HasMaxLength(250)''', 1)
          write(path, text)

          migration = Path('src/Dhole.Pricing.Persistence/Migrations/20260827170000_MakeRatePodOptional.cs')
          migration.write_text('''using Dhole.Pricing.Persistence.DbContexts;\nusing Microsoft.EntityFrameworkCore.Infrastructure;\nusing Microsoft.EntityFrameworkCore.Migrations;\n\n#nullable disable\n\nnamespace Dhole.Pricing.Persistence.Migrations;\n\n[DbContext(typeof(ServiceDbContext))]\n[Migration("20260827170000_MakeRatePodOptional")]\npublic partial class MakeRatePodOptional : Migration\n{\n    protected override void Up(MigrationBuilder migrationBuilder)\n    {\n        migrationBuilder.AlterColumn<Guid>(\n            name: "pod_id",\n            schema: "pricing",\n            table: "RateHeaders",\n            type: "uuid",\n            nullable: true,\n            oldClrType: typeof(Guid),\n            oldType: "uuid");\n\n        migrationBuilder.AlterColumn<string>(\n            name: "pod_name",\n            schema: "pricing",\n            table: "RateHeaders",\n            type: "character varying(250)",\n            maxLength: 250,\n            nullable: true,\n            oldClrType: typeof(string),\n            oldType: "character varying(250)",\n            oldMaxLength: 250);\n\n        migrationBuilder.AlterColumn<string>(\n            name: "pod_code",\n            schema: "pricing",\n            table: "RateHeaders",\n            type: "character varying(80)",\n            maxLength: 80,\n            nullable: true,\n            oldClrType: typeof(string),\n            oldType: "character varying(80)",\n            oldMaxLength: 80);\n    }\n\n    protected override void Down(MigrationBuilder migrationBuilder)\n    {\n        migrationBuilder.Sql("UPDATE pricing.\\\"RateHeaders\\\" SET pod_id = '00000000-0000-0000-0000-000000000000' WHERE pod_id IS NULL;");\n        migrationBuilder.Sql("UPDATE pricing.\\\"RateHeaders\\\" SET pod_name = '' WHERE pod_name IS NULL;");\n        migrationBuilder.Sql("UPDATE pricing.\\\"RateHeaders\\\" SET pod_code = '' WHERE pod_code IS NULL;");\n\n        migrationBuilder.AlterColumn<Guid>(\n            name: "pod_id", schema: "pricing", table: "RateHeaders", type: "uuid", nullable: false, oldClrType: typeof(Guid), oldType: "uuid", oldNullable: true);\n        migrationBuilder.AlterColumn<string>(\n            name: "pod_name", schema: "pricing", table: "RateHeaders", type: "character varying(250)", maxLength: 250, nullable: false, oldClrType: typeof(string), oldType: "character varying(250)", oldMaxLength: 250, oldNullable: true);\n        migrationBuilder.AlterColumn<string>(\n            name: "pod_code", schema: "pricing", table: "RateHeaders", type: "character varying(80)", maxLength: 80, nullable: false, oldClrType: typeof(string), oldType: "character varying(80)", oldMaxLength: 80, oldNullable: true);\n    }\n}\n''', encoding='utf-8')

          # Screen 4 metadata: expose the imported rate comment in /select.
          path = 'src/Dhole.Pricing.Contracts/Imports/Response/ImportRateSelectDto.cs'
          text = read(path)
          old = '    decimal? TotalSale = null,\n    int? TransitDays = null\n);'
          new = '    decimal? TotalSale = null,\n    int? TransitDays = null,\n    string? SpaceComment = null\n);'
          if old not in text:
              raise SystemExit('ImportRateSelectDto tail not found')
          write(path, text.replace(old, new, 1))

          path = 'src/Dhole.Pricing.Persistence/Repositories/ImportFclRateRepository.cs'
          text = read(path)
          old = '''                x.RawDataJson ?? "{}",\n                x.Status.ToString(),\n                x.UsedAsRateCount\n            ))'''
          new = '''                x.RawDataJson ?? "{}",\n                x.Status.ToString(),\n                x.UsedAsRateCount,\n                SpaceComment: x.SpaceComment\n            ))'''
          if old not in text:
              raise SystemExit('Import select repository projection not found')
          write(path, text.replace(old, new, 1))

          path = 'src/Dhole.Pricing.Application/Features/Imports/GetImportRatesForSelect/GetImportRatesForSelectQueryHandler.cs'
          text = read(path)
          old = '            rate.CurrencyId,\n            rate.TotalSale,\n            rate.TransitDays\n        );'
          new = '            rate.CurrencyId,\n            rate.TotalSale,\n            rate.TransitDays,\n            rate.SpaceComment\n        );'
          if old not in text:
              raise SystemExit('Import select fallback DTO projection not found')
          write(path, text.replace(old, new, 1))
          PY

      - name: Verify Pricing build
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Api/Dockerfile -t dhole/pricing-api:verify .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit backend upgrades
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-imported-rate-validity-fix.yml
          git add src
          git commit -m "feat(pricing): make POD optional and expose rate comments"
          git push origin HEAD:master
