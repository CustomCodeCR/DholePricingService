name: Verify quote migration mapping (temporary)
on:
  push:
    branches: [verify/quote-snakecase-20261021]
  pull_request:
    branches: [master]
permissions:
  contents: read
  packages: read
jobs:
  verify-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/quote-snakecase-20261021
      - name: Build Pricing and prove EF model is synchronized
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e HOME=/tmp -e DOTNET_CLI_HOME=/tmp \
            -e GITHUB_ACTOR="$GITHUB_ACTOR" -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            bash -lc '
              set -euo pipefail
              export NuGetPackageSourceCredentials_github="Username=$GITHUB_ACTOR;Password=$GITHUB_TOKEN;ValidAuthenticationTypes=Basic"
              dotnet restore src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj --configfile /src/NuGet.Config
              dotnet build src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj --no-restore --configuration Release --verbosity minimal
              dotnet tool install --tool-path /tmp/ef dotnet-ef --version 10.0.9
              /tmp/ef/dotnet-ef migrations has-pending-model-changes \
                --no-build --configuration Release \
                --project src/Dhole.Pricing.Persistence/Dhole.Pricing.Persistence.csproj \
                --startup-project src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj \
                --context ServiceDbContext
            '
