name: Fix own LCL build

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/fix-own-lcl-build.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Fix SQL literal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Dhole.Pricing.Api/Endpoints/OwnLclFobScenarioEndpoints.cs')
          text = path.read_text()
          old = 'lookup.CommandText = "SELECT 1 FROM pricing."OwnLclConsolidations" WHERE id=@id AND is_active=TRUE LIMIT 1;";'
          new = 'lookup.CommandText = """SELECT 1 FROM pricing."OwnLclConsolidations" WHERE id=@id AND is_active=TRUE LIMIT 1;""";'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one SQL literal anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Dhole.Pricing.Api/Endpoints/OwnLclFobScenarioEndpoints.cs
          git commit -m "fix(pricing): correct own LCL consolidation lookup SQL"
          git push origin HEAD:develop
