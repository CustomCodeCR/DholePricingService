name: Realtime F6.02 Pricing contract and production-code build (isolated)
on:
  push:
    branches:
      - feature/dhole-realtime-universal-rt-20261107-01
    paths:
      - 'src/Dhole.Pricing.Persistence/DbContexts/ServiceDbContext.cs'
      - 'src/Dhole.Pricing.Persistence/Messaging/PricingRealtimeInvalidation.cs'
      - 'src/Dhole.Pricing.Workers/Outbox/OutboxProcessor.cs'
      - 'tests/Dhole.Pricing.IntegrationTests/F6PricingRealtimeContractTests.cs'
      - 'tests/Dhole.Pricing.IntegrationTests/Dhole.Pricing.IntegrationTests.csproj'
      - 'version.json'
      - 'Directory.Build.targets'
      - 'CHANGELOG.md'
      - '.github/workflows/realtime-f6-pricing.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  pricing-f6-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Enforce Pricing SemVer and release metadata
        run: python3 scripts/verify_dhole_version.py
      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username github-actions --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile NuGet.Config
      - name: Restore F6 tests and production dependency graph
        run: dotnet restore tests/Dhole.Pricing.IntegrationTests/Dhole.Pricing.IntegrationTests.csproj --configfile NuGet.Config
      - name: Build Pricing API, persistence and F6 tests
        run: dotnet build tests/Dhole.Pricing.IntegrationTests/Dhole.Pricing.IntegrationTests.csproj --configuration Release --no-restore --warnaserror
      - name: Build Pricing worker and production Outbox processor
        run: dotnet build src/Dhole.Pricing.Workers/Dhole.Pricing.Workers.csproj --configuration Release --warnaserror
      - name: Test minimal Pricing event contract, security and release flags
        run: |
          mkdir -p TestResults
          dotnet test tests/Dhole.Pricing.IntegrationTests/Dhole.Pricing.IntegrationTests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~F6PricingRealtimeContractTests" \
            --logger "trx;LogFileName=rt-20261107-01-f6-pricing.trx" \
            --results-directory TestResults \
            -- RunConfiguration.TreatNoTestsAsError=true
      - name: Upload isolated F6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rt-20261107-01-f6-pricing-tests
          path: TestResults/
          if-no-files-found: warn
