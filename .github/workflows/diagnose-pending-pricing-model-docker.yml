name: Diagnose Pricing EF model in SDK container

on:
  push:
    paths:
      - '.github/workflows/diagnose-pending-pricing-model-docker.yml'

permissions:
  contents: write
  packages: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout service
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diagnostic migration in SDK container
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Dhole.Pricing.Api/Program.cs')
          text = path.read_text(encoding='utf-8-sig')
          old = '''using (var scope = app.Services.CreateScope())\n{\n    var dbContext = scope.ServiceProvider.GetRequiredService<ServiceDbContext>();\n\n    await dbContext.Database.MigrateAsync();\n}\n'''
          new = '''if (!string.Equals(Environment.GetEnvironmentVariable("EF_DESIGN_TIME"), "1", StringComparison.Ordinal))\n{\n    using var scope = app.Services.CreateScope();\n    var dbContext = scope.ServiceProvider.GetRequiredService<ServiceDbContext>();\n    await dbContext.Database.MigrateAsync();\n}\n'''
          if old not in text:
              raise SystemExit('Program migration block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          docker run --rm \
            -e EF_DESIGN_TIME=1 \
            -e GITHUB_ACTOR="$GITHUB_ACTOR" \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -v "$PWD:/src" \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            bash -lc '
              set -euo pipefail
              export NuGetPackageSourceCredentials_github="Username=${GITHUB_ACTOR};Password=${GITHUB_TOKEN};ValidAuthenticationTypes=Basic"
              dotnet restore src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj --configfile NuGet.Config
              dotnet build src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj -c Release --no-restore
              dotnet tool install --tool-path /tmp/dhole-dotnet-ef dotnet-ef --version 10.0.9
              /tmp/dhole-dotnet-ef/dotnet-ef migrations add DiagnosticPendingPricingModel \
                --project src/Dhole.Pricing.Persistence/Dhole.Pricing.Persistence.csproj \
                --startup-project src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj \
                --configuration Release \
                --no-build \
                --output-dir Migrations
            '

          echo '===== GENERATED MIGRATION ====='
          MIGRATION_FILE="$(find src/Dhole.Pricing.Persistence/Migrations -maxdepth 1 -type f -name '*DiagnosticPendingPricingModel.cs' ! -name '*.Designer.cs' | head -n 1)"
          test -n "$MIGRATION_FILE"
          cat "$MIGRATION_FILE"
          echo '===== SNAPSHOT DIFF ====='
          git diff -- src/Dhole.Pricing.Persistence/Migrations/ServiceDbContextModelSnapshot.cs || true

      - name: Remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          rm -f .github/workflows/diagnose-pending-pricing-model-docker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/diagnose-pending-pricing-model-docker.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(pricing): remove container EF diagnostic workflow"
            git push origin HEAD:master
          fi
