name: Apply billing client support master

on:
  push:
    branches: [codex/bill-to-client-master-20260910]
    paths:
      - '.github/workflows/apply-bill-to-client-master-20260910.yml'

permissions:
  contents: write
  packages: read

jobs:
  apply-and-validate:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated billing-client feature commits
        shell: bash
        run: |
          set -euo pipefail
          commits=(
            9fb43c269502290a65d89f56e75c7398358a59a0
            e346d3f7c4bb2e7fc81be732110f5d9bd7d270f8
            7b72f54a66f066511538ff540513963b39cbab47
            91a7d3bf7e410724715692a34563884d9c1ab49d
            ecfc1e73fac1214b514906258c7560b3327008ff
            1c309cc7788e347f1ac89773be514ac6de17bc4a
            b4737645533866597f5d2b23e44753a3c60dfcd2
            d2149d267f6e042a3543aafea4b926dc67651f9d
            bad55ec075ae35b743efb9baa018601a72584d64
            664ad3522a321f2e3e0e721ac5561865fb8a44d9
            67ea59ba043c5ea0da7927f3d12cf7202f975374
            a21f1ec3d1279c8520bdb4d35721bb8ac470e358
            7b0bc2b99fe8543c61d58ddb2c7e26e135ce59ae
            a21d4d1d2c9616c4e38bb62cd4072cef501bcf8e
            d60821dd488a27d68dc1a5f1b495776cd454cdf1
            41b2d759393903c0f3690d5c4581bb79c2ff94b3
          )
          for commit in "${commits[@]}"; do
            echo "Cherry-picking $commit"
            git cherry-pick "$commit"
          done

      - name: Apply master consistency fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Preserve the master dashboard response shape; one historical feature commit
          # also contained an unrelated dashboard change that is not part of this feature.
          path = Path('src/Dhole.Pricing.Api/Endpoints/RateEndpoints.cs')
          text = path.read_text(encoding='utf-8')
          start = text.index('private static async Task<IResult> GetRateDashboardAsync')
          end = text.index('private static async Task<IResult> GetRatesAsync', start)
          segment = text[start:end]
          if 'return EndpointResults.FromPaged(result, httpContext);' in segment:
              segment = segment.replace(
                  'return EndpointResults.FromPaged(result, httpContext);',
                  'return EndpointResults.FromResult(result, httpContext);',
                  1,
              )
              text = text[:start] + segment + text[end:]
              path.write_text(text, encoding='utf-8')
          elif 'return EndpointResults.FromResult(result, httpContext);' not in segment:
              raise RuntimeError('Unexpected dashboard return shape.')

          # Keep the EF model snapshot aligned with the explicit migration/configuration.
          path = Path('src/Dhole.Pricing.Persistence/Migrations/ServiceDbContextModelSnapshot.cs')
          text = path.read_text(encoding='utf-8')
          detail_start = text.index('modelBuilder.Entity("Dhole.Pricing.Domain.Rates.Entities.RateDetail"')
          header_start = text.index('modelBuilder.Entity("Dhole.Pricing.Domain.Rates.Entities.RateHeader"', detail_start)
          block = text[detail_start:header_start]
          if 'b.Property<string>("BillToClient")' not in block:
              marker = '                    b.Property<string>("ChargeBasis")\n'
              insert = '''                    b.Property<string>("BillToClient")\n                        .HasMaxLength(200)\n                        .HasColumnType("character varying(200)")\n                        .HasColumnName("bill_to_client");\n\n'''
              if marker not in block:
                  raise RuntimeError('RateDetail snapshot insertion point not found.')
              block = block.replace(marker, insert + marker, 1)
              text = text[:detail_start] + block + text[header_start:]
              path.write_text(text, encoding='utf-8')

          # The paged projection constructs RateDetailDto directly and must carry the field.
          path = Path('src/Dhole.Pricing.Persistence/Repositories/RateHeaderRepository.cs')
          text = path.read_text(encoding='utf-8')
          old = '''                        d.ApplyDestinationTax,\n                        d.DestinationTaxRate,\n                        d.DestinationTaxAmount\n                    ))'''
          new = '''                        d.ApplyDestinationTax,\n                        d.DestinationTaxRate,\n                        d.DestinationTaxAmount,\n                        d.BillToClient\n                    ))'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise RuntimeError('RateHeaderRepository RateDetailDto projection not found.')

          checks = {
              'src/Dhole.Pricing.Domain/Rates/Entities/RateDetail.cs': ['BillToClient', 'ConfigureBillToClient'],
              'src/Dhole.Pricing.Contracts/Rates/Request/CreateRateDetailRequest.cs': ['BillToClient'],
              'src/Dhole.Pricing.Contracts/Rates/Request/UpsertRateExtraDetailRequest.cs': ['BillToClient'],
              'src/Dhole.Pricing.Contracts/Rates/Response/RateDetailDto.cs': ['BillToClient'],
              'src/Dhole.Pricing.Application/Features/Rates/CreateRate/CreateRateCommandHandler.cs': ['ConfigureBillToClient'],
              'src/Dhole.Pricing.Application/Features/Rates/UpdateRate/UpdateRateCommandHandler.cs': ['ConfigureBillToClient'],
              'src/Dhole.Pricing.Application/Features/Rates/DuplicateRate/DuplicateRateCommandHandler.cs': ['ConfigureBillToClient(detail.BillToClient)'],
              'src/Dhole.Pricing.Application/Services/RateExtraDetailResolver.cs': ['BillToClient'],
              'src/Dhole.Pricing.Application/Services/RateFixedCostSynchronizer.cs': ['BillToClient'],
              'src/Dhole.Pricing.Api/Endpoints/RateEndpoints.cs': ['detail.BillToClient'],
              'src/Dhole.Pricing.Persistence/Repositories/RateHeaderRepository.cs': ['d.BillToClient'],
              'src/Dhole.Pricing.Persistence/Migrations/ServiceDbContextModelSnapshot.cs': ['BillToClient', 'bill_to_client'],
              'src/Dhole.Pricing.Persistence/Migrations/20260911033000_AddRateDetailBillToClient.cs': ['bill_to_client'],
          }
          for filename, needles in checks.items():
              value = Path(filename).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in value:
                      raise RuntimeError(f'Missing {needle!r} in {filename}')
          print('Master billing-client feature shape validated.')
          PY

      - name: Validate API build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Api/Dockerfile -t dhole/pricing-bill-to-client-master-validation .

      - name: Finalize feature branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-bill-to-client-master-20260910.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(pricing): finalize billing client support on master'
          git push origin codex/bill-to-client-master-20260910
