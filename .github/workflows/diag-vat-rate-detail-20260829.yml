name: Diagnose VAT Rate Detail 20260829
on:
  push:
    branches: [fix/rate-detail-vat-persistence-20260829]
    paths: ['.github/workflows/diag-vat-rate-detail-20260829.yml']
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rate-detail-vat-persistence-20260829
      - name: Inspect relevant methods
        shell: bash
        run: |
          set -e
          echo '=== RateHeader Add/Update detail ==='
          grep -n -A45 -B8 'AddRateDetail\|UpdateRateDetail' src/Dhole.Pricing.Domain/Rates/Entities/RateHeader.cs || true
          echo '=== Update handler mutations ==='
          grep -n -A55 -B10 'resolvedDetails\|addedDetails\|modifiedDetails' src/Dhole.Pricing.Application/Features/Rates/UpdateRate/UpdateRateCommandHandler.cs | tail -n 260 || true
          echo '=== command item definitions ==='
          grep -R -n -A25 -B4 'record .*Rate.*Detail.*Item\|record .*ExtraDetail' src/Dhole.Pricing.Application/Features/Rates src/Dhole.Pricing.Contracts/Rates | head -n 300 || true
