name: Apply own LCL matrix and public origin fixes

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-own-lcl-matrix-and-origin-20260902.yml'

permissions:
  contents: write
  packages: read

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply own LCL cost-matrix patch
        shell: bash
        run: |
          set -u
          python .github/scripts/patch_own_lcl_matrix_and_origin_20260902.py || true
          grep -q 'ResolveFromCostMatrixAsync' src/Dhole.Pricing.Api/Endpoints/OwnLclDestinationAutomationEndpoints.cs

      - name: Point quote QR to isolated /origin page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/Dhole.Pricing.Infrastructure/Reports/RateReportDataFactory.cs')
          text = path.read_text(encoding='utf-8')
          old = '''        return $"{baseAddress}/origen/{Uri.EscapeDataString(polCode)}"
                      + $"?shipmentMode={Uri.EscapeDataString(rate.ShipmentMode.ToString())}"
                      + $"&route={Uri.EscapeDataString(routeKey)}";'''
          new = '''        return $"{baseAddress}/origin"
                      + $"?pol={Uri.EscapeDataString(polCode)}"
                      + $"&shipmentMode={Uri.EscapeDataString(rate.ShipmentMode.ToString())}"
                      + $"&route={Uri.EscapeDataString(routeKey)}";'''
          if old not in text:
              raise SystemExit('Could not find legacy /origen QR URL block')
          text = text.replace(old, new, 1)
          if '/origen/' in text:
              raise SystemExit('Legacy /origen QR URL is still present')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Pricing API build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Api/Dockerfile -t dhole/pricing-own-lcl-matrix-validation .

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-own-lcl-matrix-and-origin-20260902.yml
          rm -f .github/scripts/patch_own_lcl_matrix_and_origin_20260902.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(pricing): resolve own LCL destination costs from cost matrix'
          git push origin develop
