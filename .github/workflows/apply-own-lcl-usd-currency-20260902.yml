name: Apply own-LCL USD currency matching

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-own-lcl-usd-currency-20260902.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch own-LCL currency filter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/Dhole.Pricing.Api/Endpoints/OwnLclDestinationAutomationEndpoints.cs')
          text = path.read_text(encoding='utf-8')
          old = '&& cost.CurrencyCode == "USD"'
          new = '&& (cost.CurrencyName == "USD" || cost.CurrencyCode == "USD")'

          if old not in text:
              raise SystemExit('Expected own-LCL USD filter was not found.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          grep -Fq 'cost.CurrencyName == "USD" || cost.CurrencyCode == "USD"' \
            src/Dhole.Pricing.Api/Endpoints/OwnLclDestinationAutomationEndpoints.cs

      - name: Commit directly to develop
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-own-lcl-usd-currency-20260902.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(pricing): match USD costs by currency name in own LCL'
          git push origin develop
