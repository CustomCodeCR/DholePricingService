name: Apply own-LCL null/LCL shipment mode rule

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-own-lcl-null-lcl-20260902.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply own-LCL shipment mode patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/Dhole.Pricing.Api/Endpoints/OwnLclDestinationAutomationEndpoints.cs')
          text = path.read_text(encoding='utf-8')

          old = '''                // Own-LCL accepts only rows configured for every mode (NULL) or explicitly LCL.
                // FCL, FTL and LTL rows are intentionally excluded.
                && (cost.ShipmentMode == null || cost.ShipmentMode == ShipmentMode.Lcl)'''

          new = '''                // In the cost matrix, NULL is the wildcard persisted for costs that apply to every mode.
                // Own-LCL must therefore accept NULL and explicit LCL, while excluding FCL, FTL and LTL.
                && (!cost.ShipmentMode.HasValue || cost.ShipmentMode.Value == ShipmentMode.Lcl)'''

          if old not in text:
              raise SystemExit('Expected own-LCL shipment mode filter was not found; refusing to patch a different shape.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          grep -Fq '!cost.ShipmentMode.HasValue || cost.ShipmentMode.Value == ShipmentMode.Lcl' \
            src/Dhole.Pricing.Api/Endpoints/OwnLclDestinationAutomationEndpoints.cs

      - name: Commit directly to develop
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-own-lcl-null-lcl-20260902.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(pricing): accept null and LCL in own LCL cost matrix'
          git push origin develop
