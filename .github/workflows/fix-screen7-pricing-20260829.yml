name: Fix Screen 7 Pricing financials and VAT

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-screen7-pricing-20260829.yml'

permissions:
  contents: write
  packages: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Pricing fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          resolver_path = Path('src/Dhole.Pricing.Application/Services/RateExtraDetailResolver.cs')
          resolver = resolver_path.read_text(encoding='utf-8-sig')
          old = '''                cost.IsAccountant,
                input.Quantity,
                cost.ChargeBasis
            )'''
          new = '''                cost.IsAccountant,
                input.Quantity,
                cost.ChargeBasis,
                input.ApplyDestinationTax,
                input.DestinationTaxRate
            )'''
          if old not in resolver:
              raise SystemExit('RateExtraDetailResolver anchor not found')
          resolver_path.write_text(resolver.replace(old, new, 1), encoding='utf-8')

          dto_path = Path('src/Dhole.Pricing.Contracts/Rates/Response/RateDto.cs')
          dto = dto_path.read_text(encoding='utf-8-sig')
          old_end = '''    IReadOnlyCollection<RateServiceDto> Services
);'''
          new_end = '''    IReadOnlyCollection<RateServiceDto> Services
)
{
    public decimal TotalTaxUsd => CalculateTaxTotals().TaxUsd;
    public decimal TotalTaxCrc => CalculateTaxTotals().TaxCrc;
    public decimal TotalSaleWithTaxUsd => TotalSaleUsd + TotalTaxUsd;
    public decimal TotalSaleWithTaxCrc => TotalSaleCrc + TotalTaxCrc;

    private (decimal TaxUsd, decimal TaxCrc) CalculateTaxTotals()
    {
        decimal taxUsd = 0m;
        decimal taxCrc = 0m;
        var exchangeRate = ExchangeRateApplied is > 0m ? ExchangeRateApplied : ExchangeRateSale;

        foreach (var detail in RateDetails)
        {
            var tax = detail.DestinationTaxAmount;
            if (tax <= 0m) continue;

            var code = detail.CurrencyCode.Trim().ToUpperInvariant();
            if (code == "USD")
            {
                taxUsd += tax;
                if (exchangeRate is > 0m) taxCrc += tax * exchangeRate.Value;
            }
            else if (code == "CRC")
            {
                taxCrc += tax;
                if (exchangeRate is > 0m) taxUsd += tax / exchangeRate.Value;
            }
        }

        return (
            decimal.Round(taxUsd, 2, MidpointRounding.AwayFromZero),
            decimal.Round(taxCrc, 2, MidpointRounding.AwayFromZero)
        );
    }
}'''
          if old_end not in dto:
              raise SystemExit('RateDto anchor not found')
          dto_path.write_text(dto.replace(old_end, new_end, 1), encoding='utf-8')

          helper_path = Path('src/Dhole.Pricing.Contracts/Rates/Response/RateDtoFinancialExtensions.cs')
          helper_path.write_text(r'''namespace Dhole.Pricing.Contracts.Rates.Response;

public static class RateDtoFinancialExtensions
{
    public static RateDto WithRecalculatedFinancials(this RateDto rate)
    {
        if (rate.RateDetails.Count == 0)
            return rate;

        var exchangeRate = rate.ExchangeRateApplied is > 0m
            ? rate.ExchangeRateApplied
            : rate.ExchangeRateSale;

        decimal costUsd = 0m;
        decimal saleUsd = 0m;
        decimal costCrc = 0m;
        decimal saleCrc = 0m;
        var recognized = false;

        foreach (var detail in rate.RateDetails)
        {
            var quantity = detail.Quantity > 0m ? detail.Quantity : 1m;
            var cost = detail.CostAmount * quantity;
            var sale = detail.SaleAmount * quantity;
            var code = detail.CurrencyCode.Trim().ToUpperInvariant();

            if (code == "USD")
            {
                recognized = true;
                costUsd += cost;
                saleUsd += sale;
                if (exchangeRate is > 0m)
                {
                    costCrc += cost * exchangeRate.Value;
                    saleCrc += sale * exchangeRate.Value;
                }
            }
            else if (code == "CRC")
            {
                recognized = true;
                costCrc += cost;
                saleCrc += sale;
                if (exchangeRate is > 0m)
                {
                    costUsd += cost / exchangeRate.Value;
                    saleUsd += sale / exchangeRate.Value;
                }
            }
        }

        if (!recognized)
            return rate;

        costUsd = decimal.Round(costUsd, 2, MidpointRounding.AwayFromZero);
        saleUsd = decimal.Round(saleUsd, 2, MidpointRounding.AwayFromZero);
        costCrc = decimal.Round(costCrc, 2, MidpointRounding.AwayFromZero);
        saleCrc = decimal.Round(saleCrc, 2, MidpointRounding.AwayFromZero);
        var utilityUsd = saleUsd - costUsd;
        var utilityCrc = saleCrc - costCrc;

        var nativeCode = rate.CurrencyCode.Trim().ToUpperInvariant();
        var totalCostAmount = nativeCode == "CRC" ? costCrc : nativeCode == "USD" ? costUsd : rate.TotalCostAmount;
        var totalSaleAmount = nativeCode == "CRC" ? saleCrc : nativeCode == "USD" ? saleUsd : rate.TotalSaleAmount;
        var totalUtilityAmount = totalSaleAmount - totalCostAmount;
        var margin = totalSaleAmount <= 0m ? 0m : totalUtilityAmount / totalSaleAmount * 100m;

        return rate with
        {
            TotalCostAmount = totalCostAmount,
            TotalSaleAmount = totalSaleAmount,
            TotalUtilityAmount = totalUtilityAmount,
            TotalCostUsd = costUsd,
            TotalSaleUsd = saleUsd,
            TotalUtilityUsd = utilityUsd,
            TotalCostCrc = costCrc,
            TotalSaleCrc = saleCrc,
            TotalUtilityCrc = utilityCrc,
            MarginPercentage = margin,
        };
    }
}
''', encoding='utf-8')

          mappings_path = Path('src/Dhole.Pricing.Application/Features/Rates/RateMappings.cs')
          mappings = mappings_path.read_text(encoding='utf-8-sig')
          mappings = mappings.replace('''        return new RateDto(\n''', '''        var dto = new RateDto(\n''', 1)
          old_tail = '''                .ToList()
        );
    }
}'''
          new_tail = '''                .ToList()
        );

        return dto.WithRecalculatedFinancials();
    }
}'''
          if old_tail not in mappings:
              raise SystemExit('RateMappings tail anchor not found')
          mappings_path.write_text(mappings.replace(old_tail, new_tail, 1), encoding='utf-8')

          repo_path = Path('src/Dhole.Pricing.Persistence/Repositories/RateHeaderRepository.cs')
          repo = repo_path.read_text(encoding='utf-8-sig')
          old_return = '''            .ToListAsync(cancellationToken);

        return PagedResult<RateDto>.Create(items, page.PageNumber, page.PageSize, total);
    }

    public async Task<IReadOnlyCollection<RateSelectDto>> GetForSelectAsync('''
          new_return = '''            .ToListAsync(cancellationToken);

        // RateDetails are the source of truth. Recalculate the read snapshot so historical
        // rows created before the USD/CRC aggregate columns were backfilled never show 0.00.
        items = items.Select(item => item.WithRecalculatedFinancials()).ToList();

        return PagedResult<RateDto>.Create(items, page.PageNumber, page.PageSize, total);
    }

    public async Task<IReadOnlyCollection<RateSelectDto>> GetForSelectAsync('''
          if old_return not in repo:
              raise SystemExit('RateHeaderRepository paged return anchor not found')
          repo_path.write_text(repo.replace(old_return, new_return, 1), encoding='utf-8')
          PY

          git diff --check

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget update source github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile NuGet.Config
          dotnet restore DholePricingService.slnx --configfile NuGet.Config
          dotnet build DholePricingService.slnx -c Release --no-restore

      - name: Commit directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Dhole.Pricing.Application/Services/RateExtraDetailResolver.cs \
                  src/Dhole.Pricing.Contracts/Rates/Response/RateDto.cs \
                  src/Dhole.Pricing.Contracts/Rates/Response/RateDtoFinancialExtensions.cs \
                  src/Dhole.Pricing.Application/Features/Rates/RateMappings.cs \
                  src/Dhole.Pricing.Persistence/Repositories/RateHeaderRepository.cs
          git commit -m 'fix(pricing): persist VAT and repair rate financial summaries'
          git push origin HEAD:master
