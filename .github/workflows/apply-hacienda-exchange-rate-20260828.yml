name: Apply Hacienda exchange rate

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-hacienda-exchange-rate-20260828.yml'

permissions:
  contents: write
  packages: read

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exchange-rate patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_hacienda_exchange_rate_20260828.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/Dhole.Pricing.Api/Endpoints/RateEndpoints.cs')
          text = p.read_text()
          marker = 'using Dhole.Pricing.Api.Extensions;\n'
          addition = marker + 'using Dhole.Pricing.Application.Abstractions.Services;\n'
          if 'using Dhole.Pricing.Application.Abstractions.Services;' not in text:
              if marker not in text:
                  raise SystemExit('RateEndpoints using marker not found')
              text = text.replace(marker, addition, 1)
          p.write_text(text)
          PY

      - name: Validate API build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Api/Dockerfile -t dhole/pricing-hacienda-exchange-validation .

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-hacienda-exchange-rate-20260828.yml
          rm -f .github/scripts/patch_hacienda_exchange_rate_20260828.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(pricing): snapshot Hacienda exchange rate on quotes'
          git push origin master
