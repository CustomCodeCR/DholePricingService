name: Deploy Dhole Pricing - Production

on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  packages: read
concurrency:
  group: dhole-pricing-production
  cancel-in-progress: true
env:
  COMPOSE_FILE: .dhole-system/deploy/docker-compose.services.yml
  DHOLE_IMAGE_TAG: latest
  DHOLE_NETWORK: dhole
  COMPOSE_PROJECT: dhole
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Normalize runner workspace permissions
        run: |
          set -euo pipefail
          if [ -d "$GITHUB_WORKSPACE" ]; then
            RUNNER_UID="$(id -u)"
            RUNNER_GID="$(id -g)"
            docker run --rm -v "$GITHUB_WORKSPACE:/workspace" alpine:3.22 \
              sh -c "chown -R ${RUNNER_UID}:${RUNNER_GID} /workspace"
          fi
      - uses: actions/checkout@v4
      - name: Load Dhole deployment infrastructure
        run: |
          set -euo pipefail
          clone_ok=0
          for attempt in 1 2 3 4 5; do
            rm -rf .dhole-system
            if git clone --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system; then
              clone_ok=1
              break
            fi

            echo "::warning::No se pudo clonar DholeSystem (intento $attempt/5). Verificando DNS antes de reintentar..."
            getent ahosts github.com || true
            sleep $((attempt * 5))
          done

          if [ "$clone_ok" -ne 1 ]; then
            echo "::error::No fue posible resolver/conectar con github.com después de 5 intentos."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dhole-env"
          bash .dhole-system/deploy/prepare-environments.sh /opt/dhole/.env "$RUNNER_TEMP/dhole-env"
          echo "DHOLE_ENV_FILE=$RUNNER_TEMP/dhole-env/.env.production" >> "$GITHUB_ENV"
      - name: Verify production server
        run: docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" config -q
      - name: Test Dynamics credential preflight without network
        shell: bash
        run: bash scripts/tests/test-check-dynamics-pricing-credential.sh
      - name: Validate configured Dynamics key against active template before redeploy
        shell: bash
        run: |
          set -euo pipefail
          # The secret always comes from the canonical production host file,
          # never from a GitHub secret or the disposable prepared copy.
          # Fail closed if Compose overrides or omits the same key on pricing-api.
          # docker compose config contains secrets, so inspect it only in memory.
          python3 - "$DHOLE_ENV_FILE" "$COMPOSE_FILE" "$COMPOSE_PROJECT" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          source = Path("/opt/dhole/.env").read_text(encoding="utf-8")
          entries = [line.split("=", 1)[1].strip()
                     for line in source.splitlines()
                     if line.startswith("DynamicsQuoteSync__ApiKey=")]
          if len(entries) != 1:
              raise SystemExit("::error::Expected exactly one Dynamics key in /opt/dhole/.env.")
          expected = entries[0].strip('"').strip("'")
          command = ["docker", "compose", "--env-file", sys.argv[1],
                     "-f", sys.argv[2], "-p", sys.argv[3], "config", "--format", "json"]
          result = subprocess.run(command, text=True, capture_output=True, check=True)
          data = json.loads(result.stdout)
          service = data.get("services", {}).get("pricing-api", {})
          env = service.get("environment") or {}
          if isinstance(env, list):
              env = dict(entry.split("=", 1) for entry in env if "=" in entry)
          if env.get("DynamicsQuoteSync__ApiKey") != expected:
              raise SystemExit("::error::pricing-api Compose configuration does not receive the canonical DynamicsQuoteSync__ApiKey from /opt/dhole/.env. No containers changed.")
          print("Pricing API runtime Dynamics key matches the canonical /opt/dhole/.env (secret hidden).")
          PY
          # Only the canonical key is sent to the read-only Dynamics preflight.
          bash scripts/check-dynamics-pricing-credential.sh /opt/dhole/.env "$DHOLE_ENV_FILE"
      - name: Verify EF migrations are synchronized
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            -e HOME=/tmp \
            -e DOTNET_CLI_HOME=/tmp \
            -e GITHUB_ACTOR="$GITHUB_ACTOR" \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            bash -lc '
              set -euo pipefail
              export NuGetPackageSourceCredentials_github="Username=$GITHUB_ACTOR;Password=$GITHUB_TOKEN;ValidAuthenticationTypes=Basic"
              dotnet restore src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj --configfile /src/NuGet.Config
              # Compilar explícitamente para que Actions muestre los errores reales de C#
              # en vez del mensaje opaco de dotnet-ef "Build failed".
              dotnet build src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj \
                --no-restore \
                --configuration Release \
                --verbosity minimal
              dotnet tool install --tool-path /tmp/ef dotnet-ef --version 10.0.9
              /tmp/ef/dotnet-ef migrations has-pending-model-changes \
                --no-build \
                --configuration Release \
                --project src/Dhole.Pricing.Persistence/Dhole.Pricing.Persistence.csproj \
                --startup-project src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj
            '
      - name: Build images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Api/Dockerfile -t dhole/pricing-api:latest -t "dhole/pricing-api:$SHA_TAG" .
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Workers/Dockerfile -t dhole/pricing-workers:latest -t "dhole/pricing-workers:$SHA_TAG" .
      - name: Deploy Pricing
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" up -d --no-deps --force-recreate --pull never pricing-api pricing-workers
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" ps pricing-api pricing-workers
      - name: Verify Pricing API health
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" ps -q pricing-api)"
          test -n "$CONTAINER_ID"
          for attempt in $(seq 1 18); do
            STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER_ID")"
            echo "Pricing API status: $STATUS (attempt $attempt/18)"
            if [ "$STATUS" = "healthy" ]; then exit 0; fi
            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ] || [ "$STATUS" = "unhealthy" ]; then docker logs --tail 200 "$CONTAINER_ID" || true; exit 1; fi
            sleep 5
          done
          docker logs --tail 200 "$CONTAINER_ID" || true
          exit 1
      - name: Verify pricing client quote report
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" ps -q pricing-api)"
          test -n "$CONTAINER_ID"
          docker exec "$CONTAINER_ID" sh -ec '
            REPORTS_URL="${Reports__Client__BaseAddress:-http://reports-api:5208}"
            REPORTS_HEADER="${Reports__Client__InternalServiceKeyHeader:-X-Dhole-Service-Key}"
            REPORTS_KEY="${Reports__Client__InternalServiceKey:-dhole-local-reports-service-key-change-in-production}"
            HTTP_CODE="$(curl --silent --show-error -H "Content-Type: application/json" -H "$REPORTS_HEADER: $REPORTS_KEY" --data "{\"format\":\"pdf\",\"dataJson\":{\"company\":{\"name\":\"Grupo Castro Fallas\",\"website\":\"https://logisticacastrofallas.com\"},\"generated\":{\"date\":\"30/08/2026\"},\"rate\":{\"quoteNumber\":\"SMOKE-TEST\",\"clientName\":\"Validación Dhole\",\"route\":\"Origen → Destino\",\"carrier\":\"Naviera\",\"containerSummary\":\"1 x 40 HC\",\"transitTime\":\"Por confirmar\",\"freeDays\":0,\"validFrom\":\"30/08/2026\",\"validTo\":\"30/09/2026\",\"total\":\"USD 0.00\",\"includes\":\"\",\"subjectTo\":\"\",\"excludes\":\"\"},\"items\":[]},\"fileName\":\"pricing-smoke-test\",\"sheetName\":\"Tarifa\"}" "$REPORTS_URL/api/internal/reports/templates/pricing-fcl-client-quote/generate" --output /tmp/pricing-smoke-test.pdf --write-out "%{http_code}")"
            if [ "$HTTP_CODE" != "200" ]; then cat /tmp/pricing-smoke-test.pdf; exit 1; fi
            test -s /tmp/pricing-smoke-test.pdf
            head -c 4 /tmp/pricing-smoke-test.pdf | grep -q "%PDF"
            rm -f /tmp/pricing-smoke-test.pdf
          '
      - name: Cleanup old images
        if: always()
        run: docker image prune -f
