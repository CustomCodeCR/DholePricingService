name: Persist pricing source trace
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/persist-pricing-source-trace-20260828.yml'
permissions:
  contents: write
  packages: read
jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source trace persistence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Dhole.Pricing.Api/Endpoints/DataExtractionImportEndpoints.cs')
          text = path.read_text(encoding='utf-8-sig')
          if 'using System.Text.Json;' not in text:
              text = 'using System.Text.Json;\n' + text
          old = '''            var extraction = DataExtractionPricingImportMapper.ToApplicationResult(\n                request.Response,\n                request.ExtractionExecutionId,\n                request.PricingImportId\n            );\n'''
          new = '''            var enrichedResponse = request.Response with\n            {\n                Rows = request.Response.Rows\n                    .Select(row => row with\n                    {\n                        RawJson = EnrichRawJson(row.RawJson, request),\n                    })\n                    .ToArray(),\n            };\n\n            var extraction = DataExtractionPricingImportMapper.ToApplicationResult(\n                enrichedResponse,\n                request.ExtractionExecutionId,\n                request.PricingImportId\n            );\n'''
          if old not in text:
              raise SystemExit('extraction mapper anchor not found')
          text = text.replace(old, new, 1)
          anchor = '''    }\n\n}\n'''
          helper = '''    }\n\n    private static string EnrichRawJson(\n        string? rawJson,\n        ImportRatesFromExtractionRequest request\n    )\n    {\n        object? extracted = null;\n        if (!string.IsNullOrWhiteSpace(rawJson))\n        {\n            try\n            {\n                extracted = JsonSerializer.Deserialize<JsonElement>(rawJson);\n            }\n            catch (JsonException)\n            {\n                extracted = rawJson;\n            }\n        }\n\n        return JsonSerializer.Serialize(new\n        {\n            _dholeSource = new\n            {\n                emailMessageId = request.EmailMessageId,\n                emailAttachmentId = request.EmailAttachmentId,\n                sourceType = request.SourceType,\n                fromAddress = request.FromAddress,\n                subject = request.Subject,\n                originalFileName = request.OriginalFileName,\n            },\n            extracted,\n        });\n    }\n\n}\n'''
          if anchor not in text:
              raise SystemExit('class closing anchor not found')
          text = text.replace(anchor, helper, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Validate API build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker build --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Api/Dockerfile -t dhole/pricing-source-trace-validation .
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/persist-pricing-source-trace-20260828.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(pricing): persist email source trace on imports"
          git push origin HEAD:master
