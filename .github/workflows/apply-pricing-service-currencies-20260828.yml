name: Apply Pricing Service Currencies 20260828

on:
  push:
    branches: [feature/pricing-service-currencies-20260828]
    paths:
      - '.github/scripts/apply-pricing-service-currencies-20260828.py'
      - '.github/workflows/apply-pricing-service-currencies-20260828.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  apply-validate:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pricing-service-currencies-20260828
          fetch-depth: 0

      - name: Apply implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-pricing-service-currencies-20260828.py

      - name: Restore, build and generate migration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e GITHUB_ACTOR="$GITHUB_ACTOR" \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -v "$PWD:/src" -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0 bash -lc '
              set -euo pipefail
              export PATH="$PATH:/tmp/.dotnet/tools"
              export NuGetPackageSourceCredentials_github="Username=${GITHUB_ACTOR};Password=${GITHUB_TOKEN};ValidAuthenticationTypes=Basic"
              dotnet restore src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj --configfile NuGet.Config
              dotnet build src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj --no-restore --configuration Release
              dotnet tool install --tool-path /tmp/.dotnet/tools dotnet-ef --version 10.0.9
              dotnet ef migrations add AddPricingServiceCurrencies20260828 \
                --project src/Dhole.Pricing.Persistence/Dhole.Pricing.Persistence.csproj \
                --startup-project src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj \
                --context ServiceDbContext \
                --output-dir Migrations \
                --no-build \
                --configuration Release
              dotnet build src/Dhole.Pricing.Api/Dhole.Pricing.Api.csproj --configuration Release
            '

      - name: Build production images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Api/Dockerfile -t dhole/pricing-service-currency-api-validation .
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Pricing.Workers/Dockerfile -t dhole/pricing-service-currency-worker-validation .

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Maurice Lang'
          git config user.email '106346768+MauLang18@users.noreply.github.com'
          git add src tests
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'feat(pricing): support service currencies and dual totals'
          git push origin HEAD:feature/pricing-service-currencies-20260828
