name: Apply commercial status rules

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-commercial-status-rules-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/apply_commercial_status_rules_20260828.py

      - name: Validate build
        run: docker build --target build -t dhole-pricing-commercial-status-validation .

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-commercial-status-rules-20260828.yml
          rm -f .github/scripts/apply_commercial_status_rules_20260828.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(pricing): align commercial status workflow"
          git push origin HEAD:master
