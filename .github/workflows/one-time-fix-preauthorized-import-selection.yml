name: One-time fix preauthorized imported rate selection

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/one-time-fix-preauthorized-import-selection.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply imported rate selection fix
        run: python3 .github/scripts/fix_preauthorized_import_selection.py
      - name: Validate patch
        run: git diff --check
      - name: Commit functional change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-fix-preauthorized-import-selection.yml
          git rm .github/scripts/fix_preauthorized_import_selection.py
          git add src/Dhole.Pricing.Application/Features/Rates/CreateRate/CreateRateCommandHandler.cs
          git commit -m "fix(pricing): allow preauthorized imported rates in quotes"
          git push origin HEAD:develop
