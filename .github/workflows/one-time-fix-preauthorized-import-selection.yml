name: One-time fix preauthorized imported rate selection

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/one-time-fix-preauthorized-import-selection.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Allow preauthorized imported rates to be used
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Dhole.Pricing.Application/Features/Rates/CreateRate/CreateRateCommandHandler.cs')
          text = path.read_text()
          old = '''            if (importedRate.Status == ImportStatus.Pending)
            {
                if (!command.CanApproveImportedRate)
                {
                    return Result.Failure<Guid>(PricingErrors.ImportFclRateInvalidStatus);
                }

                importedRate.Approve(command.CreatedBy);
                automaticallyApprovedImport = true;
            }

            if (importedRate.Status != ImportStatus.Approved)
'''
          new = '''            // PreAuthorized is a machine-approved state created specifically so an active
            // imported rate can be selected by Pricing without requiring the manual
            // approve-import scope. Promote it to Approved when it is actually used.
            if (importedRate.Status == ImportStatus.PreAuthorized)
            {
                importedRate.Approve(command.CreatedBy);
                automaticallyApprovedImport = true;
            }
            else if (importedRate.Status == ImportStatus.Pending)
            {
                if (!command.CanApproveImportedRate)
                {
                    return Result.Failure<Guid>(PricingErrors.ImportFclRateInvalidStatus);
                }

                importedRate.Approve(command.CreatedBy);
                automaticallyApprovedImport = true;
            }

            if (importedRate.Status != ImportStatus.Approved)
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one import-status block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-fix-preauthorized-import-selection.yml
          git add src/Dhole.Pricing.Application/Features/Rates/CreateRate/CreateRateCommandHandler.cs
          git commit -m "fix(pricing): allow preauthorized imported rates in quotes"
          git push origin HEAD:develop
